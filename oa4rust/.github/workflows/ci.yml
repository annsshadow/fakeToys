name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dialect: [postgres, mysql]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Run unit tests (DATABASE_DIALECT=${{ matrix.dialect }})
        run: cargo test --workspace --lib
        env:
          DATABASE_DIALECT: ${{ matrix.dialect }}

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: o2server
          POSTGRES_PASSWORD: password
          POSTGRES_DB: oa4rust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=postgres://o2server:password@localhost:5432/postgres" >> $GITHUB_ENV
      - name: Run integration tests
        run: cargo test --test integration_runner -- --ignored
