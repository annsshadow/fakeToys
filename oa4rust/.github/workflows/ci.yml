name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dialect: [postgres, mysql]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Run unit tests (DATABASE_DIALECT=${{ matrix.dialect }})
        run: cargo test --workspace --lib
        env:
          DATABASE_DIALECT: ${{ matrix.dialect }}

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dialect: [postgres, mysql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: o2server
          POSTGRES_PASSWORD: password
          POSTGRES_DB: oa4rust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: oa4rust
          MYSQL_USER: o2server
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Set DATABASE_URL for ${{ matrix.dialect }}
        run: |
          if [ "${{ matrix.dialect }}" = "postgres" ]; then
            echo "DATABASE_URL=postgres://o2server:password@localhost:5432/postgres" >> $GITHUB_ENV
          elif [ "${{ matrix.dialect }}" = "mysql" ]; then
            echo "DATABASE_URL=mysql://o2server:password@localhost:3306/oa4rust" >> $GITHUB_ENV
          fi
      - name: Run integration tests (${{ matrix.dialect }})
        run: cargo test --test integration_runner
        env:
          DATABASE_DIALECT: ${{ matrix.dialect }}

  # ── plan002 U9: Java-Rust 行为对比接入 CI ──────────────────────────────────
  # 该 job 依赖外部 Java 容器（o2server），冷启动约 10 分钟，且对比结果可能因
  # 外部 Java 服务状态波动。因此设为 allow-failure（continue-on-error），
  # 失败不影响主构建（unit-tests / integration-tests）。
  behavior-compare:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: o2server
          POSTGRES_PASSWORD: password
          POSTGRES_DB: oa4rust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://o2server:password@localhost:5432/oa4rust
      DATABASE_DIALECT: postgres
      RUST_LOG: warn
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      # 提前拉起 o2server，使冷启动（~10min）与后续 cargo 编译并行
      - name: Start o2server (Java) container
        run: |
          docker run -d --name o2server \
            -p 18080:80 \
            -e MYSQL_ROOT_PASSWORD=o2oa@2022 \
            o2oa/o2server:latest

      - name: Build server binary
        run: cargo build --bin oa4rust

      # 路由无冲突冒烟测试（仅依赖 postgres，与 Java 容器无关）
      - name: Route-conflict probe (u2_probe)
        run: cargo test --test u2_probe

      # 启动 Rust 服务（启动时自动应用表迁移），等待 /health 就绪。
      # 用 nohup 使后台进程跨 step 存活（否则 step 结束会被回收）。
      - name: Start Rust server
        run: |
          nohup ./target/debug/oa4rust > rust_server.log 2>&1 &
          echo $! > rust_server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              echo "Rust server ready"; break
            fi
            sleep 5
          done

      # 就绪探针：POST /jaxrs/secret/set 初始化，再 GET /jaxrs/server/execute。
      # 超时上限 ≥15 分钟（100 次 × 10s），避免 o2server 冷启动导致 CI 误失败。
      - name: Wait for o2server readiness
        run: |
          ready=0
          for i in $(seq 1 100); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              http://localhost:18080/jaxrs/secret/set \
              -H 'Content-Type: application/json' \
              -d '{"secret":"o2oa@2022"}' || true)
            if [ "$code" != "000" ] && [ "$code" != "502" ] && [ "$code" != "503" ]; then
              ex=$(curl -s -o /dev/null -w '%{http_code}' \
                http://localhost:18080/jaxrs/server/execute || true)
              if [ "$ex" != "000" ]; then
                echo "o2server ready after $((i * 10))s (secret/set=$code, server/execute=$ex)"
                ready=1
                break
              fi
            fi
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo "::warning::o2server not ready within timeout; behavior comparison will SKIP Java side"
          fi

      # ── U1: 应用 Rust 侧共享种子 ───────────────────────────────────────────
      # 种子覆盖组织域（unit/person/group/role/identity）与内容域（CMS/BBS/Meeting），
      # 使字面模板 URL 在 Rust 侧命中已建资源。fail-fast：种子失败即终止 job。
      # 注意：CI 不执行 Java 侧 REST 种子（编排成本高且不稳定），
      # FAIL 基线预计高于本地双栈全播种环境，属预期偏差。
      - name: Apply behavior-compare seed fixtures
        run: |
          psql "postgres://o2server:password@localhost:5432/oa4rust" \
            -f oa4rust/tests/behavior_comparison/seeds/seed_fixtures.sql
          echo "Seed fixtures applied successfully"

      - name: Run behavior comparison (Rust vs Java)
        run: cargo test --test behavior_compare -- --nocapture
        env:
          BEHAVIOR_COMPARE: "1"
          JAVA_SERVICE_URL: http://localhost:18080

      # ── U1: 报告产物上传 ─────────────────────────────────────────────────
      # behavior-report.md 在测试步骤中自动生成（target/debug/），
      # 上传为 GitHub Actions artifact，FAIL 数变化可在 PR 上直接观察。
      - name: Upload behavior-compare report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-report-${{ github.run_id }}
          path: target/debug/behavior-report.md
          retention-days: 30

      # ── U1: 基线注记 ─────────────────────────────────────────────────────
      # CI 仅执行 Rust 侧种子，本地双栈全播种环境更完整，
      # FAIL 数差异属预期，在 PR 描述中预防性说明。
      - name: Print baseline note
        if: always()
        run: |
          echo "::notice::CI baseline: Rust-side seeds applied only. Full local run includes Java-side REST seeds (xadmin login + category/forum creation). FAIL count in CI will be higher than local full-seed baseline (1212 PASS / 836 FAIL / 1996 SKIP)."

      - name: Teardown
        if: always()
        run: |
          if [ -f rust_server.pid ]; then kill "$(cat rust_server.pid)" || true; fi
          docker rm -f o2server || true

  # ── plan002 U9 / R8: OpenAPI 安全方案守卫 ────────────────────────────────────
  # scripts/gen_openapi_paths.py 重新生成 OpenAPI lib.rs 时，会把 Bearer 安全方案
  # 注入到 securitySchemes。若注入静默丢失，API 文档将缺少鉴权信息且难以察觉。
  # 本 job 校验已纳入版本控制的生成产物（crates/openapi/src/lib.rs）确实含有
  # 安全方案注入。若后续 CI 加入“重新生成 OpenAPI”步骤，应在该步骤之后再加一次
  # 本断言（即先 regenerate 再 check）。
  openapi-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify OpenAPI security scheme is present
        run: python oa4rust/scripts/check_openapi_security.py
