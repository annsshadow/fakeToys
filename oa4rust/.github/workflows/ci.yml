name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dialect: [postgres, mysql]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Run unit tests (DATABASE_DIALECT=${{ matrix.dialect }})
        run: cargo test --workspace --lib
        env:
          DATABASE_DIALECT: ${{ matrix.dialect }}

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dialect: [postgres, mysql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: o2server
          POSTGRES_PASSWORD: password
          POSTGRES_DB: oa4rust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: oa4rust
          MYSQL_USER: o2server
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Set DATABASE_URL for ${{ matrix.dialect }}
        run: |
          if [ "${{ matrix.dialect }}" = "postgres" ]; then
            echo "DATABASE_URL=postgres://o2server:password@localhost:5432/postgres" >> $GITHUB_ENV
          elif [ "${{ matrix.dialect }}" = "mysql" ]; then
            echo "DATABASE_URL=mysql://o2server:password@localhost:3306/oa4rust" >> $GITHUB_ENV
          fi
      - name: Run integration tests (${{ matrix.dialect }})
        run: cargo test --test integration_runner
        env:
          DATABASE_DIALECT: ${{ matrix.dialect }}
