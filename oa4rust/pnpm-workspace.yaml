packages:
  - 'frontend/apps/*'
  - 'frontend/packages/*'
  - 'mobile'
  - '!**/test/**'
# 安全覆盖：把传递依赖中的已知漏洞版本抬到修复版本。
# 目标版本优先选择"依赖树中已存在的版本"，以降低兼容性风险。
# 对应告警见 GitHub Dependabot（mobile 的 uni-app 工具链）。
overrides:
  '@babel/core@7.25.2': '7.29.6'
  '@intlify/core-base@9.1.9': '9.14.5'
  '@intlify/message-compiler@9.1.9': '9.14.5'
  '@intlify/message-resolver@9.1.9': '9.1.11'
  'adm-zip@0.5.16': '0.6.1'
  'body-parser@1.20.3': '1.20.6'
  'cookie@0.6.0': '0.7.0'
  'jimp@0.10.3': '0.22.12'
  'jpeg-js@0.3.7': '0.4.4'
  'path-to-regexp@0.1.10': '0.1.13'
  # postcss-selector-parser <7.1.6：flat selector 解析的二次复杂度（ReDoS 面）。
  # 旧覆盖只抬到 6.1.3，仍 <7.1.6；改用范围覆盖强制到 7.1.6（该版本已在依赖树中，
  # 2 个依赖已在用，兼容性已验证过一次）。6→7 为跨主版本，前端 web 构建需 Docker 复核。
  'postcss-selector-parser@<7.1.6': '7.1.6'
  # source-map-js 1.2.1：event-loop DoS（indexed source-map section offsets）。
  # 目标版本 1.2.2 已在依赖树中（desktop vue 3.5.42 链），补丁级兼容。
  'source-map-js@1.2.1': '1.2.2'
  # mobile uni-app 工具链 pin 的 vue 3.4.21 家族：
  # @vue/server-renderer <3.5.42 存在 XSS（SSR 属性名黑名单缺 CR 转义）。
  # 3.5.42 家族已在依赖树中（desktop），Vue 3.4→3.5 同主版本向下兼容。
  'vue@3.4.21': '3.5.42'
  '@vue/compiler-core@3.4.21': '3.5.42'
  '@vue/compiler-dom@3.4.21': '3.5.42'
  '@vue/compiler-sfc@3.4.21': '3.5.42'
  '@vue/compiler-ssr@3.4.21': '3.5.42'
  '@vue/reactivity@3.4.21': '3.5.42'
  '@vue/runtime-core@3.4.21': '3.5.42'
  '@vue/runtime-dom@3.4.21': '3.5.42'
  '@vue/server-renderer@3.4.21': '3.5.42'
  '@vue/shared@3.4.21': '3.5.42'
  'postcss@8.5.6': '8.5.26'
  'send@0.18.0': '0.19.0'
  'ws@8.18.0': '8.21.0'
  # 以下三项用范围覆盖：同一漏洞在树中存在多份副本，
  # 按版本逐个覆盖会漏掉新解析出的版本。
  'esbuild@<=0.24.2': '0.25.12'
  'qs@<6.16.0': '6.16.0'
  'vite@<=6.4.2': '6.4.3'
allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@dcloudio/uni-app-plus@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-app-uts@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-app-vite@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-app-vue@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-app@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-cli-shared@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-cloud@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-components@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-console@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-h5-vite@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-h5-vue@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-h5@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-i18n@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-mp-compiler@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-mp-vite@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-mp-vue@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-mp-weixin@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-nvue-styler@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-push@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-shared@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-stat@3.0.0-alpha-5020620260914001'
  - '@dcloudio/vite-plugin-uni@3.0.0-alpha-5020620260914001'
