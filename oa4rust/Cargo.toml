[workspace]
members = [
    "crates/shared",
    "crates/auth",
    "crates/personal",
    "crates/express",
    "crates/personal_extend",
    "crates/control",
    "crates/program_init",
    "crates/message",
    "crates/portal",
    "crates/bbs",
    "crates/calendar",
    "crates/component",
    "crates/file",
    "crates/ai",
    "crates/attendance",
    "crates/correlation",
    "crates/general",
    "crates/hotpic",
    "crates/jpush",
    "crates/meeting",
    "crates/mind",
    "crates/cms_control",
    "crates/cms_express",
    "crates/process_express",
    "crates/query_express",
    "crates/process_designer",
    "crates/program_center",
    "crates/base",
    "crates/query_service",
    "crates/process_bam",
    "crates/process_surface",
    "crates/file_assemble_control",
    "crates/ai_assemble_control",
    "crates/hotpic_assemble_control",
    "crates/organization_assemble_express",
    "crates/mind_assemble_control",
    "crates/attendance_assemble_control",
    "crates/general_assemble_control",
    "crates/meeting_assemble_control",
    "crates/message_assemble_communicate",
    "crates/portal_assemble_designer",
    "crates/correlation_service_processing",
    "crates/portal_assemble_surface",
    "crates/processplatform_service_processing",
    "crates/bbs_assemble_control",
    "crates/calendar_assemble_control",
    "crates/component_assemble_control",
    "crates/jpush_assemble_control",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "0.7", features = ["macros", "json"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "macros", "chrono"] }
deadpool-postgres = "0.12"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
bcrypt = "0.15"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
md5 = "0.7"
urlencoding = "2"
