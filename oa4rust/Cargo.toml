mcp_server = { path = "crates/mcp_server" }
shared = { path = "crates/shared" }
express = { path = "crates/express" }
message = { path = "crates/message" }
portal = { path = "crates/portal" }
bbs = { path = "crates/bbs" }
calendar = { path = "crates/calendar" }
component = { path = "crates/component" }

[workspace.dependencies]
axum = { version = "0.8", features = ["macros", "json", "ws"] }
tokio = { version = "1", features = ["full"] }
 sea-orm = { version = "1.0", features = ["runtime-tokio-rustls", "sqlx-postgres", "macros", "with-chrono", "with-uuid"] }
deadpool-postgres = "0.14"
deadpool = { version = "0.12", features = ["rt_tokio_1"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
bcrypt = "0.15"
base64 = "0.22"
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
  sha2 = { version = "0.10", features = ["oid"] }
  sha1 = "0.10"
  hex = "0.4"
  digest = { version = "0.10", features = ["oid"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
md5 = "0.7"
urlencoding = "2"
 captcha = "1.0.0"
  reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"] }
 async-trait = "0.1"
 sqlparser = "0.51"
 sysinfo = "0.33"
  utoipa = { version = "4", features = ["axum_extras"] }
  utoipa-swagger-ui = { version = "7", features = ["axum"] }
  openapi = { path = "crates/openapi" }
  redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
  futures-util = "0.3"
  lopdf = "0.32"
  x509-parser = "0.16"
  rsa = "0.9"
  signature = "2"
  p256 = "0.13"

