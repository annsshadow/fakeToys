# Auth + Personal module routes for Rust backend
# Include this file from the main nginx.conf

upstream rust_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
}

# Auth + Personal module endpoints -> Rust backend
location ~ ^/jaxrs/(authentication|person|password|reset|secret)/ {
    proxy_pass http://rust_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Health check
    proxy_next_upstream error timeout http_500 http_502 http_503;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}
