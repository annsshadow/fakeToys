# Auth + Personal module routes for Rust backend
# Include this file from the main nginx.conf

# Auth + Personal module endpoints -> Rust backend
# Include this file inside the TLS-enabled server block. Keep HTTP on a separate
# server that redirects to HTTPS; AUTH_COOKIE_SECURE=true assumes TLS termination.
location ~ ^/jaxrs/(authentication|person|password|reset|secret)(/|$) {
    proxy_pass http://rust_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Browser auth responses and session cookies must never be cached.
    add_header Cache-Control "no-store" always;
    proxy_hide_header X-Powered-By;
    proxy_next_upstream error timeout http_500 http_502 http_503;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}
