# ──────────────────────────────────────────────────────────────────────────────
# OA4Rust U9 灰度迁移 — nginx 路由配置示例
#
# 路由策略：
#   - 按 /jaxrs/{module}/* 前缀分发
#   - attendance / control / express / meeting → Rust (127.0.0.1:3000)
#   - message / calendar / portal / bbs        → Java (127.0.0.1:8080)
#   - 未匹配前缀 fallback 到 Java（保留 Java 兜底能力）
#
# 灰度切换方式：
#   1. 全量切流：将模块从 java_backend 移到 rust_backend
#   2. 按权重切流：在 upstream 中配置 server weight（10%/50%/90%）
#   3. 按 Header 切流：通过 X-Gray-Traffic 头强制路由（1=Rust, 0=Java）
#   4. 影子流量：mirror 模块复制请求到 o2server，忽略响应，用于一致性比对
#
# 部署方式：
#   - 生产环境替换 /etc/nginx/nginx.conf 中的相关 server/location 段
#   - 或 include 本文件：include /etc/nginx/conf.d/oa4rust-routes.conf;
# ──────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ──────────────────────────────────────────────────────────────────────────
    # Upstream 定义
    # ──────────────────────────────────────────────────────────────────────────
    upstream rust_backend {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream java_backend {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # 业务语义 upstream（推荐使用以下名称）
    upstream oa4rust_backend {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream o2server_backend {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 灰度权重 Upstream（用于按比例切流）
    # 用法：将对应模块的 proxy_pass 改为以下 upstream
    #   oa4rust_gray_10pct → 10% Rust / 90% Java
    #   oa4rust_gray_50pct → 50% Rust / 50% Java
    #   oa4rust_gray_90pct → 90% Rust / 10% Java
    # ──────────────────────────────────────────────────────────────────────────
    upstream oa4rust_gray_10pct {
        server 127.0.0.1:3000 weight=1;
        server 127.0.0.1:8080 weight=9;
    }

    upstream oa4rust_gray_50pct {
        server 127.0.0.1:3000 weight=1;
        server 127.0.0.1:8080 weight=1;
    }

    upstream oa4rust_gray_90pct {
        server 127.0.0.1:3000 weight=9;
        server 127.0.0.1:8080 weight=1;
    }

    # 影子流量专用 Upstream（mirror 到 o2server，忽略响应）
    upstream shadow_o2server_backend {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 灰度分流器（split_clients）
    # 按客户端 IP + User-Agent 哈希分流，保证同一客户端灰度比例稳定
    # 可配合 X-Gray-Traffic 头覆盖（值为 1 强制 Rust，0 强制 Java）
    # ──────────────────────────────────────────────────────────────────────────
    map $http_x_gray_traffic $gray_override {
        default "";
        1       rust;
        0       java;
    }

    split_clients "${remote_addr}${http_user_agent}" $gray_attendance {
        10%     rust;
        *       java;
    }

    split_clients "${remote_addr}${http_user_agent}" $gray_control {
        10%     rust;
        *       java;
    }

    split_clients "${remote_addr}${http_user_agent}" $gray_express {
        10%     rust;
        *       java;
    }

    split_clients "${remote_addr}${http_user_agent}" $gray_meeting {
        10%     rust;
        *       java;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 模块级灰度 Backend 映射（配合 split_clients 使用）
    # ──────────────────────────────────────────────────────────────────────────
    map $gray_attendance $backend_attendance {
        rust    oa4rust_backend;
        java    o2server_backend;
    }

    map $gray_control $backend_control {
        rust    oa4rust_backend;
        java    o2server_backend;
    }

    map $gray_express $backend_express {
        rust    oa4rust_backend;
        java    o2server_backend;
    }

    map $gray_meeting $backend_meeting {
        rust    oa4rust_backend;
        java    o2server_backend;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 限流配置（防刷）
    # ──────────────────────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # 灰度专用限流（影子流量使用更严格的限流，避免影响 Java 服务）
    limit_req_zone $binary_remote_addr zone=shadow:10m rate=50r/s;

    # ──────────────────────────────────────────────────────────────────────────
    # 灰度日志格式（用于影子流量比对）
    # ──────────────────────────────────────────────────────────────────────────
    log_format shadow '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time '
                      'backend=$upstream_addr '
                      'gray=$http_x_gray_traffic';

    # ──────────────────────────────────────────────────────────────────────────
    # Server 入口
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # 前端静态资源（o2web 构建产物，由前端团队独立部署/维护）
        # 此处仅作占位，不侵入 o2web 目录结构
        location / {
            return 404;
        }

        # ──────────────────────────────────────────────────────────────────────
        # 灰度配置 Include（由 toggle_module.sh 动态生成）
        # 取消注释以下行以启用按比例灰度：
        #   include /etc/nginx/conf.d/gray-routes.conf;
        # 注意：include 的 location ^~ 优先级高于下方 location ~，会覆盖默认路由
        # ──────────────────────────────────────────────────────────────────────
        # include /etc/nginx/conf.d/gray-routes.conf;

        # ──────────────────────────────────────────────────────────────────────
        # 灰度模块路由：Rust 接管模块（100% 切流，默认启用）
        # ──────────────────────────────────────────────────────────────────────
        # 规则：按 /jaxrs/{module}/* 前缀精确匹配
        # 使用方式：
        #   - 全量切流阶段：启用此 location，proxy_pass 指向 oa4rust_backend
        #   - 按比例切流阶段：注释此 location，启用下方"按比例灰度"段或 include
        #   - 影子流量阶段：注释此 location，启用下方"影子流量"段
        #
        # Rust 接管模块：attendance, control, express, meeting

        location ~ ^/jaxrs/(attendance|control|express|meeting)/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://oa4rust_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # ──────────────────────────────────────────────────────────────────────
        # 按比例灰度（10% / 50% / 90% 切流）
        # ──────────────────────────────────────────────────────────────────────
        # 使用方法：
        #   1. 注释上方"100% 切流"块
        #   2. 取消注释以下对应比例的 location 块
        #   3. nginx -t && nginx -s reload
        #
        # 流量比例说明：
        #   oa4rust_gray_10pct → 10% Rust / 90% Java
        #   oa4rust_gray_50pct → 50% Rust / 50% Java
        #   oa4rust_gray_90pct → 90% Rust / 10% Java
        #
        # 按 Header 强制切流（调试用）：
        #   curl -H "X-Gray-Traffic: 1" ... → 强制 Rust
        #   curl -H "X-Gray-Traffic: 0" ... → 强制 Java

        # 10% 灰度（初期验证）
        # location ~ ^/jaxrs/(attendance|control|express|meeting)/ {
        #     limit_req zone=api burst=20 nodelay;
        #
        #     proxy_pass http://oa4rust_gray_10pct;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #
        #     proxy_next_upstream error timeout http_500 http_502 http_503;
        #     proxy_connect_timeout 5s;
        #     proxy_send_timeout 10s;
        #     proxy_read_timeout 10s;
        # }

        # 50% 灰度（中期验证）
        # location ~ ^/jaxrs/(attendance|control|express|meeting)/ {
        #     limit_req zone=api burst=20 nodelay;
        #
        #     proxy_pass http://oa4rust_gray_50pct;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #
        #     proxy_next_upstream error timeout http_500 http_502 http_503;
        #     proxy_connect_timeout 5s;
        #     proxy_send_timeout 10s;
        #     proxy_read_timeout 10s;
        # }

        # 90% 灰度（放大验证）
        # location ~ ^/jaxrs/(attendance|control|express|meeting)/ {
        #     limit_req zone=api burst=20 nodelay;
        #
        #     proxy_pass http://oa4rust_gray_90pct;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #
        #     proxy_next_upstream error timeout http_500 http_502 http_503;
        #     proxy_connect_timeout 5s;
        #     proxy_send_timeout 10s;
        #     proxy_read_timeout 10s;
        # }

        # ──────────────────────────────────────────────────────────────────────
        # 按 split_clients 灰度（推荐：支持 Header 覆盖）
        # ──────────────────────────────────────────────────────────────────────
        # 使用方法：注释上方"100% 切流"块，取消注释此段
        # 特点：
        #   - 默认 10% 流量到 Rust，90% 到 Java
        #   - 携带 X-Gray-Traffic: 1 的请求强制走 Rust
        #   - 携带 X-Gray-Traffic: 0 的请求强制走 Java
        #
        # location ~ ^/jaxrs/(attendance|control|express|meeting)/ {
        #     limit_req zone=api burst=20 nodelay;
        #
        #     # 优先使用 Header 覆盖，否则使用 split_clients 结果
        #     if ($gray_override = "rust") {
        #         set $backend oa4rust_backend;
        #     }
        #     if ($gray_override = "java") {
        #         set $backend o2server_backend;
        #     }
        #     if ($gray_override = "") {
        #         set $backend oa4rust_gray_10pct;
        #     }
        #
        #     proxy_pass http://$backend;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #
        #     proxy_next_upstream error timeout http_500 http_502 http_503;
        #     proxy_connect_timeout 5s;
        #     proxy_send_timeout 10s;
        #     proxy_read_timeout 10s;
        # }

        # ──────────────────────────────────────────────────────────────────────
        # 影子流量：复制请求到 o2server（Java），忽略响应
        # ──────────────────────────────────────────────────────────────────────
        # 场景：将 Rust 已处理的请求复制一份到 Java，对比响应一致性
        # 启用方式：取消注释 mirror 块，并确保 Java 服务健康
        # 注意：需要 nginx >= 1.13.4
        #
        # location ~ ^/jaxrs/(attendance|control|express|meeting)/ {
        #     limit_req zone=shadow burst=10 nodelay;
        #
        #     proxy_pass http://oa4rust_backend;
        #
        #     # 镜像请求到 Java（忽略响应，不影响客户端）
        #     mirror /mirror_backend;
        #     mirror_request_body on;
        #
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_next_upstream error timeout http_500 http_502 http_503;
        #     proxy_connect_timeout 5s;
        #     proxy_send_timeout 10s;
        #     proxy_read_timeout 10s;
        # }
        #
        # # 影子流量专用 backend（内部 location）
        # location = /mirror_backend {
        #     internal;
        #     proxy_pass http://shadow_o2server_backend;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_connect_timeout 5s;
        #     proxy_send_timeout 10s;
        #     proxy_read_timeout 10s;
        # }

        # ──────────────────────────────────────────────────────────────────────
        # 灰度模块路由：仍由 Java 处理的模块
        # ──────────────────────────────────────────────────────────────────────
        # 规则：按 /jaxrs/{module}/* 前缀精确匹配
        # Java 保留模块示例：message, calendar, portal, bbs

        location ~ ^/jaxrs/(message|calendar|portal|bbs)/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://o2server_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # ──────────────────────────────────────────────────────────────────────
        # 按权重灰度（可选：特定 Header 触发 Rust 灰度）
        # ──────────────────────────────────────────────────────────────────────
        # 场景：仅对携带 X-Canary-Rust: 1 的请求切到 Rust，
        #       其余仍走 Java，用于内部灰度验证。
        #
        # location ~ ^/jaxrs/(attendance|control)/ {
        #     limit_req zone=api burst=20 nodelay;
        #
        #     if ($http_x_canary_rust = "1") {
        #         set $backend oa4rust_backend;
        #     }
        #     if ($http_x_canary_rust != "1") {
        #         set $backend o2server_backend;
        #     }
        #
        #     proxy_pass http://$backend;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_next_upstream error timeout http_500 http_502 http_503;
        #     proxy_connect_timeout 5s;
        #     proxy_send_timeout 10s;
        #     proxy_read_timeout 10s;
        # }

        # ──────────────────────────────────────────────────────────────────────
        # 兜底路由：未匹配前缀全部走 Java
        # ──────────────────────────────────────────────────────────────────────
        location ~ ^/jaxrs/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://o2server_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # ──────────────────────────────────────────────────────────────────────
        # 认证 + 个人模块（已有 nginx-auth-routes.conf 覆盖，此处保留引用）
        # ──────────────────────────────────────────────────────────────────────
        # include /etc/nginx/conf.d/nginx-auth-routes.conf;
    }
}
