# ──────────────────────────────────────────────────────────────────────────────
# OA4Rust U9 灰度迁移 — nginx 路由配置示例
#
# 路由策略：
#   - 按 /jaxrs/{module}/* 前缀分发
#   - attendance / control / express / meeting → Rust (127.0.0.1:3000)
#   - message / calendar / portal / bbs        → Java (127.0.0.1:8080)
#   - 未匹配前缀 fallback 到 Java（保留 Java 兜底能力）
#
# 灰度切换方式：
#   1. 全量切流：将模块从 java_upstream 移到 rust_upstream
#   2. 按权重切流：在 upstream 中配置 server weight
#   3. 按 Header/Cookie 切流：通过 if 判断（示例见 #weighted 段）
#
# 部署方式：
#   - 生产环境替换 /etc/nginx/nginx.conf 中的相关 server/location 段
#   - 或 include 本文件：include /etc/nginx/conf.d/oa4rust-routes.conf;
# ──────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ──────────────────────────────────────────────────────────────────────────
    # Upstream 定义
    # ──────────────────────────────────────────────────────────────────────────
    upstream rust_backend {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream java_backend {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 限流配置（防刷）
    # ──────────────────────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # ──────────────────────────────────────────────────────────────────────────
    # Server 入口
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # 前端静态资源（o2web 构建产物，由前端团队独立部署/维护）
        # 此处仅作占位，不侵入 o2web 目录结构
        location / {
            return 404;
        }

        # ──────────────────────────────────────────────────────────────────────
        # 灰度模块路由：Rust 接管模块
        # ──────────────────────────────────────────────────────────────────────
        # 规则：按 /jaxrs/{module}/* 前缀精确匹配
        # Rust 接管模块示例：attendance, control, express, meeting

        location ~ ^/jaxrs/(attendance|control|express|meeting)/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://rust_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # ──────────────────────────────────────────────────────────────────────
        # 灰度模块路由：仍由 Java 处理的模块
        # ──────────────────────────────────────────────────────────────────────
        # 规则：按 /jaxrs/{module}/* 前缀精确匹配
        # Java 保留模块示例：message, calendar, portal, bbs

        location ~ ^/jaxrs/(message|calendar|portal|bbs)/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://java_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # ──────────────────────────────────────────────────────────────────────
        # 按权重灰度（可选：特定 Header 触发 Rust 灰度）
        # ──────────────────────────────────────────────────────────────────────
        # 场景：仅对携带 X-Canary-Rust: 1 的请求切到 Rust，
        #       其余仍走 Java，用于内部灰度验证。
        #
        # location ~ ^/jaxrs/(attendance|control)/ {
        #     limit_req zone=api burst=20 nodelay;
        #
        #     if ($http_x_canary_rust = "1") {
        #         set $backend rust_backend;
        #     }
        #     if ($http_x_canary_rust != "1") {
        #         set $backend java_backend;
        #     }
        #
        #     proxy_pass http://$backend;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_next_upstream error timeout http_500 http_502 http_503;
        #     proxy_connect_timeout 5s;
        #     proxy_send_timeout 10s;
        #     proxy_read_timeout 10s;
        # }

        # ──────────────────────────────────────────────────────────────────────
        # 兜底路由：未匹配前缀全部走 Java
        # ──────────────────────────────────────────────────────────────────────
        location ~ ^/jaxrs/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://java_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # ──────────────────────────────────────────────────────────────────────
        # 认证 + 个人模块（已有 nginx-auth-routes.conf 覆盖，此处保留引用）
        # ──────────────────────────────────────────────────────────────────────
        # include /etc/nginx/conf.d/nginx-auth-routes.conf;
    }
}
