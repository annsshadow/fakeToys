# Auth rollback drill — Java (o2server) auth routes (fallback phase; NOT executed locally)
# Requires a running o2server (fixed-digest image) at 127.0.0.1:8080 and its secret
# initialized. Marked EXTERNAL: switching real traffic to Java is an operational step
# that also forces re-authentication and restores Java's JSON-token / legacy-cookie behavior.
upstream o2server_backend { server 127.0.0.1:8080 max_fails=3 fail_timeout=30s; }
server {
    listen 18081;
    server_name oa.local;
    location ~ ^/jaxrs/(authentication|person|password|reset|secret)(/|$) {
        proxy_pass http://o2server_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
}
