# Auth rollback drill — Rust auth routes (active during Rust-primary phase)
# Includes ONLY auth + personal modules; everything else stays on the existing stack.
# Validate:  docker run --rm -v <dir>:/conf:ro -e NGINX_TEST_CONF=/conf/nginx.conf nginx:1.27-alpine nginx -t
upstream oa4rust_backend { server 127.0.0.1:3000 max_fails=3 fail_timeout=30s; }
server {
    listen 18081;
    server_name oa.local;
    location ~ ^/jaxrs/(authentication|person|password|reset|secret)(/|$) {
        proxy_pass http://oa4rust_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        proxy_hide_header X-Powered-By;
        proxy_next_upstream error timeout http_500 http_502 http_503;
    }
}
