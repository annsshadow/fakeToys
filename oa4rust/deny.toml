# cargo-deny configuration for oa4rust
# Allows known vulnerabilities that require deeper dependency restructuring to fix.
# Re-evaluate and remove entries as upstream dependencies are updated.

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "OpenSSL",
]

[[licenses.exceptions]]
name = "ring"
allow = ["OpenSSL"]

[[licenses.exceptions]]
name = "webpki-roots"
allow = ["MPL-2.0"]

# Block lru 0.12.5 which has RUSTSEC-2026-0002 and RUSTSEC-2026-0253.
# Both advisories are fixed in lru >= 0.13, but 0.12.5 is pinned by tantivy 0.22.
[[bans.deny]]
name = "lru"
version = "=0.12.5"
reason = "RUSTSEC-2026-0002: unsound IterMut (Stacked Borrows violation)"

[[bans.deny]]
name = "lru"
version = "=0.12.5"
reason = "RUSTSEC-2026-0253: use-after-free in LruCache::pop() panic safety"

# Require all crates to come from trusted registries
[sources]
unknown-registry = "deny"
