services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: o2server
      POSTGRES_PASSWORD: password
      POSTGRES_DB: oa4rust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U o2server -d oa4rust"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: oa4rust
      MYSQL_USER: o2server
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  o2server:
    image: o2oa/o2server:latest
    container_name: oa4rust-o2server
    environment:
      MYSQL_ROOT_PASSWORD: o2oa@2022
    ports:
      - "18080:80"
    volumes:
      - o2server_config:/opt/o2server/config
      - o2server_custom:/opt/o2server/custom
      - o2server_dynamic:/opt/o2server/dynamic
      - o2server_local:/opt/o2server/local
      - o2server_logs:/opt/o2server/logs
      - o2server_webroot:/opt/o2server/webroot
      - o2server_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/80'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s

volumes:
  pgdata:
  mysqldata:
  redisdata:
  o2server_config:
  o2server_custom:
  o2server_dynamic:
  o2server_local:
  o2server_logs:
  o2server_webroot:
  o2server_mysql:
