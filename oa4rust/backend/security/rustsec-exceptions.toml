# Temporary RustSec exceptions.
# Every field is validated by scripts/validate_rustsec_exceptions.py.

[[exception]]
advisory = "RUSTSEC-2023-0071"
package = "rsa"
version = "0.9.10"
dependency_path = "dev-dependencies: mysql_async 0.37.1 -> sqlx-mysql 0.8.6 -> rsa 0.9.10"
owner = "oa4rust-security"
tracking_url = "docs/plans/2026-09-09-001-refactor-httponly-cookie-cargo-audit-rustsec-db-biome-2-5-11-plan.md"
created = "2026-10-09"
expires = "2026-11-08"
reason = "The remaining rsa crate is reachable only from the MySQL integration-test driver; production OIDC and PDF signing no longer use it. Upstream sqlx-mysql has no patched rsa release. Re-triaged 2026-10-09 at the 30-day expiry: situation unchanged — sqlx-mysql 0.8.x still pulls rsa 0.9.x (no Marvin-attack-patched upstream release), rsa stays confined to the dev-dependency MySQL test driver; renewed for another 30 days."
compensating_control = "Production packages do not depend on mysql_async; private-key operations use ring. CI audits the exact package and the exception expires after 30 days."
approved_by = "project-owner"

[[exception]]
advisory = "RUSTSEC-2026-0187"
package = "lopdf"
version = "0.26.0"
dependency_path = "processplatform_assemble_surface 0.1.0 -> genpdf 0.2.0 -> lopdf 0.26.0"
owner = "oa4rust-security"
tracking_url = "https://github.com/annsshadow/fakeToys/pull/29"
created = "2026-10-27"
expires = "2026-11-26"
reason = "genpdf 0.2.0 has no release with a patched lopdf (crates.io max is still 0.2.0, published 2021-06-17) and its maintained fork genpdfi 0.2.7 still pins lopdf ^0.26, so no upgrade chain exists. processplatform_assemble_surface uses genpdf for PDF generation only (fonts/paragraphs/images); genpdf exposes no PDF-loading API, so the vulnerable lopdf::Document::load* entry points are unreachable from untrusted input. PDF parsing/signing lives in crates/signature on patched lopdf 0.45.0. Re-triaged 2026-10-27 at the 30-day expiry: situation unchanged — genpdfi 0.2.7 (published 2026-01-27) still requires lopdf ^0.26; renewed for another 30 days."
compensating_control = "Untrusted-PDF parsing is confined to crates/signature on lopdf >= 0.42 (patched); the genpdf chain never invokes lopdf load paths. Exception expires after 30 days to force re-triage (replace genpdf or drop the export feature)."
approved_by = "project-owner"

# ── zip 提取类漏洞（RUSTSEC-2026-0367/0368/0369）──────────────────────────
# 三公告只在 extract() 把条目落盘时触发。全工作区运行时无 zip extract() 调用
# （grep crates/*/src 仅命中 query_assemble_surface 的 field.extract，与 zip 无关）。
# 上游在被依赖的各 major 上无补丁（实测：0.6.6 无更新、1.1.4→1.3.1 反引入
# RUSTSEC-2025-0168、2.4.2→2.6.1 仍在漏洞区间），登记例外，30 天重 triage。
[[exception]]
advisory = "RUSTSEC-2026-0367"
package = "zip"
version = "0.6.6"
dependency_path = "build-dependencies: utoipa-swagger-ui 6.0.0 -> zip 0.6.6"
owner = "oa4rust-security"
tracking_url = "docs/plans/2026-10-23-cross-subproject-optimization-backlog.md"
created = "2026-10-24"
expires = "2026-11-23"
reason = "SUID/SGID 位在 extract() 落盘时被保留（提权面）；该 zip 版本触达不了 extract() 落盘路径。"
compensating_control = "utoipa-swagger-ui 6.0.0 的 build-dependency，不进运行时二进制；提取路径运行期不可达"
approved_by = "project-owner"
