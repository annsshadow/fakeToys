[package]
publish.workspace = true
name = "shared"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
axum.workspace = true
tokio.workspace = true
tokio-util = "0.7"
futures-util = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "chrono"] }
deadpool-postgres.workspace = true
postgres-types.workspace = true
deadpool.workspace = true
# DB_TLS 开启时 deadpool 池的 TLS connector（与 sqlx 的 rustls 后端同根证书源）。
# rustls/tokio-rustls/webpki-roots 已在依赖图中（reqwest），此处仅显式声明
# ring provider 与直接使用。tokio-postgres-rustls 负责桥接 tokio-postgres 0.7。
# 注意：rustls 的 default 特性含 aws-lc-rs（拉 aws-lc-sys/cmake/nasm），
# 这里显式关闭 default 只取 ring 后端，保持与既有依赖图一致。
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "0.26"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
reqwest.workspace = true
urlencoding.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
dotenvy.workspace = true
chrono.workspace = true
url = "2"
tower-http = { workspace = true, features = ["cors", "trace"] }
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
async-trait.workspace = true
tower = { workspace = true, features = ["util"] }
sea-orm = { workspace = true }
redis.workspace = true
tokio-cron-scheduler = "0.10"

[dev-dependencies]

[lints]
workspace = true
