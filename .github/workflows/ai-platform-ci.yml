# 注意：本文件位于仓库根 .github/workflows/，而非计划文档中写的 augmentor/.github/workflows/。
# GitHub Actions 只识别仓库根目录下的 .github/workflows/，放在子项目下不会被触发。
# 命名与结构遵循本仓库既有约定（见 oa4rust-ci.yml / oa4rust-web.yml）：
#   - 文件名格式 <子项目>-<用途>.yml
#   - 用 paths 过滤限定到子项目目录
#   - 用 defaults.run.working-directory 指定子项目
name: AI platform CI

on:
  push:
    branches: [main, master]
    paths:
      - "augmentor/**"
      - ".github/workflows/ai-platform-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "augmentor/**"
      - ".github/workflows/ai-platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 后端：语法检查 + 单元/集成/E2E 测试 + 覆盖率门禁
  # ============================================================
  backend-test:
    name: Backend tests & coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: augmentor
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # 账本哈希槽守卫（test_ledger_hash_slots_l98）按 `git log --first-parent`
          # 核对每笔回填哈希：① fetch-depth:0 取全量历史（否则浅克隆只有 1 笔）；
          # ② PR 事件默认检出 merge ref，其 first-parent 走的是 base(main) 那条线、
          #    分支上的回填提交根本不在其中（实测 CI 只见 415 笔 = main 线，分支实为 1076），
          #    故显式检出 PR head sha，让守卫看到分支自己的线性历史。
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch all remote-tracking refs
        # 账本那几把尺子（l264 / l270 / l98）的判据面是 `git rev-list --remotes --tags`。
        #
        # 上面这个 `ref: <sha>` + fetch-depth:0 的组合只把**那一个提交**的历史取下来，
        # 不建 `refs/remotes/origin/*` —— 实测 CI 上 `--remotes --tags` 只返回 1 笔，
        # 于是账本里点名的跨分支提交被一律读成「解析不到」：l270 的 not_a_commit
        # 量到 731，而同一份账本在完整克隆上是 312。判据本身没错，是 CI 看不到 ref 面。
        #
        # 这一步把远端分支面补回来（与本地 `git fetch origin` 同口径），账本尺子才量的是
        # 「账本 vs 仓库」而不是「账本 vs 这一次检出」。
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'


      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: augmentor/requirements-dev.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt


      - name: Byte-compile all sources
        # -W error::SyntaxWarning：把「invalid escape sequence」这类**只打印不报错**的
        # 编译期告警升级为错误。此前这里是裸 compileall —— 告警在 CI 日志里滚过去，
        # 退出码仍然是 0，等于没有门禁。
        run: |
          set -euo pipefail
          python -W error::SyntaxWarning -m compileall -q augmentor api cli.py

      - name: Run tests with coverage gate
        # pytest.ini 里配的是 --cov-fail-under=99（**不是 80** —— 这行注释自己过时过一轮，
        # 门槛是 99%），覆盖率不足会直接失败。
        #
        # 为什么把输出同时写进 job summary：这道门禁**红的时候，只有 step 日志里才有答案**，
        # 而 step 日志要登录网页才能看 ⇒ 一道「红但看不出是哪一格」的门禁，
        # 等于把「谁该修」这个问题原样留给下一个人（这一道门禁在 2026-11-02 到
        # 2026-11-12 之间一直红，而**没有任何一处**记录过它红在哪一格）。
        # 写进 $GITHUB_STEP_SUMMARY 之后，GitHub 的 check-run API
        # （**公开仓库无需 token 就能读**）就能拿到失败名单与覆盖率读数
        # ⇒ 「谁该修」这件事从此有机器可读的答案。
        run: |
          rc=0
          pytest 2>&1 | tee pytest.log || rc=$?
          {
            echo "### augmentor · pytest（CI 口径：$(python -V 2>&1)）"
            echo
            echo '```'
            tail -n 200 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 同一份读数再写成 **GitHub 注解**（`::error::`）：注解走
          # `GET /repos/{owner}/{repo}/check-runs/{id}/annotations`，**公开仓库无需 token 就能读**
          # ⇒ 「哪几支红 / 覆盖率差多少」这件事连匿名访客都问得到。
          # 只取前 12 支失败 + 两行覆盖率读数（注解多了会被折叠，且真正要修的通常就在最前面）。
          # 每条 grep 都必须带 `|| true`：GitHub 的默认 shell 是 `bash -eo pipefail`
          # ⇒ pipefail 让管道里任何一支非零都算整条失败，而**测试全绿时那两条 grep
          # 恰恰一条都匹配不上**（grep 退出码 1）⇒ 不带 `|| true` 的话，
          # **测试全绿反而把这一步打红**（本轮实测踩到过：上一枚提交那一步红了，
          # 而日志里一支失败都没有 —— 红的是这条 grep 自己）。
          (grep -E "^(FAILED|ERROR) " pytest.log || true) | head -n 12 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          (grep -E "Required test coverage|^TOTAL " pytest.log || true) | head -n 2 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          (tail -n 1 pytest.log | grep -E "passed|failed|error" || true) | while IFS= read -r line; do
            echo "::error::pytest 收尾读数：${line}"
          done
          exit $rc

      - name: Coverage summary
        if: always()
        run: |
          set -euo pipefail
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-platform-coverage
          path: |
            augmentor/coverage.xml
            augmentor/.coverage
          if-no-files-found: warn

  # ============================================================
  # 前端：类型检查 + 生产构建
  # ============================================================
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: augmentor/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: augmentor/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        # --max-warnings 0 已写进 package.json 的 lint 脚本：任何新 warning 都会让 CI 失败
        run: npm run lint

      - name: Format check
        # A282：格式门此前**不在 CI 里** ⇒ `prettier --check src` 恒红也长期没人看见。
        # 本轮起仓内基线已重排到绿（5 只文件），这道门从「恒红」变成可用的守门人。
        run: npm run format:check

      - name: Test with coverage gate
        # 覆盖率门槛（70%）配置在 vitest.config.ts 的 coverage.thresholds，
        # 所以必须跑 test:coverage 才会真正校验；npm run test 只跑用例
        run: npm run test:coverage

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        # 0 告警门禁：chunk 体积等 Rollup 告警不改退出码，必须断言日志。
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build-web.log
          bash "$GITHUB_WORKSPACE/scripts/assert-no-warnings.sh" /tmp/build-web.log "augmentor web"

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-platform-web-dist
          path: augmentor/web/dist
          if-no-files-found: error

  # ============================================================
  # Docker：验证镜像可构建且容器能通过健康检查
  # ============================================================
  docker-build:
    name: Docker image smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349

      - name: Build image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: augmentor
          file: augmentor/docker/Dockerfile
          push: false
          load: true
          tags: ai-data-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container starts and serves health endpoint
        run: |
          set -euo pipefail
          docker run -d --name ai-ci -p 8000:8000 \
            -e BAIDU_API_KEY=ci-placeholder \
            -e BAIDU_SECRET_KEY=ci-placeholder \
            ai-data-platform:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then
              echo "health check passed after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "health check timed out"
          docker logs ai-ci
          exit 1

      - name: Verify OpenAPI routes are served
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/openapi.json > /tmp/openapi.json
          python3 - <<'PY'
          import json
          spec = json.load(open("/tmp/openapi.json"))
          paths = spec["paths"]
          assert "/api/health" in paths
          assert "/api/augment/start" in paths
          assert "/api/quality/report" in paths
          assert "/api/versions/history" in paths
          print(f"routes served: {len(paths)}")
          PY

      - name: Container logs on failure
        if: failure()
        run: docker logs ai-ci || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f ai-ci || true
