name: OA4Rust web quality

on:
  push:
    branches: [main, master]
    paths:
      - "oa4rust/**"
      - "!oa4rust/backend/**"
      - "oa4rust/pnpm-workspace.yaml"
      - "oa4rust/package.json"
      - "oa4rust/pnpm-lock.yaml"
      - "oa4rust/biome.json"
      - "oa4rust/tsconfig*.json"
      - "oa4rust/scripts/**"
      - ".github/workflows/oa4rust-web.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "oa4rust/**"
      - "!oa4rust/backend/**"
      - "oa4rust/pnpm-workspace.yaml"
      - "oa4rust/package.json"
      - "oa4rust/pnpm-lock.yaml"
      - "oa4rust/biome.json"
      - "oa4rust/tsconfig*.json"
      - "oa4rust/scripts/**"
      - ".github/workflows/oa4rust-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oa4rust-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: oa4rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Activate pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          node --version
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Vitest tests
        run: pnpm test
      - name: Run mobile Vitest tests
        run: pnpm test:mobile
      - name: Type-check all packages
        run: pnpm typecheck
      - name: Run Biome gate on the whole frontend
        run: pnpm lint
      - name: Build desktop
        # 0 告警门禁：Vite/Rollup/lightningcss 的告警不改变退出码，构建照样 exit 0。
        # 只判退出码等于没判，所以把日志落盘再断言一次（判据见 scripts/assert-no-warnings.sh）。
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/build-desktop.log
          bash "$GITHUB_WORKSPACE/scripts/assert-no-warnings.sh" /tmp/build-desktop.log "oa4rust desktop"
      - name: Build mobile (uni-app H5)
        run: |
          set -o pipefail
          pnpm --filter @oa4rust/mobile build:h5 2>&1 | tee /tmp/build-mobile-h5.log
          bash "$GITHUB_WORKSPACE/scripts/assert-no-warnings.sh" /tmp/build-mobile-h5.log "oa4rust mobile (H5)"
      - name: Build mobile (WeChat mini program)
        run: |
          set -o pipefail
          pnpm --filter @oa4rust/mobile build:mp-weixin 2>&1 | tee /tmp/build-mobile-mp.log
          bash "$GITHUB_WORKSPACE/scripts/assert-no-warnings.sh" /tmp/build-mobile-mp.log "oa4rust mobile (mp-weixin)"
