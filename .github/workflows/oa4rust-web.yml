name: OA4Rust web quality

on:
  push:
    branches: [main, master]
    paths:
      - "oa4rust-web/**"
      - ".github/workflows/oa4rust-web.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "oa4rust-web/**"
      - ".github/workflows/oa4rust-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oa4rust-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: oa4rust-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Activate pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          node --version
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Vitest tests
        run: pnpm test
      - name: Type-check all packages
        run: pnpm typecheck
      - name: Run Biome gate on the whole frontend
        run: pnpm lint
      - name: Build desktop
        run: pnpm build
      - name: Build mobile (uni-app H5)
        run: pnpm --filter @oa4rust/mobile build:h5
