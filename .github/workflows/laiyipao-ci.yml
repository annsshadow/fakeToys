# laiyipao（三端游戏）CI：Go 服务端 + admin 管理端 + miniapp 小程序/H5。
# 此前 laiyipao 是仓库内唯一没有 CI 覆盖的子项目——2026-09-28 起三端
# 各自的本地门禁（coverage 100%/93.7%）只靠会话内手工跑，回归无法在
# PR 上暴露。本文件对齐仓库既有约定（见 oa4rust-ci.yml / ai-platform-ci.yml）：
#   - 文件名 <子项目>-<用途>.yml，放在仓库根 .github/workflows/
#   - 动作一律 pin 到 commit SHA（与全仓一致，checkout/setup-node 同 SHA 复用）
#
# ⚠️ paths 过滤已移除（2026-10-13）。这不是风格偏好，是**设 required 闸门的前提**：
#
#   GitHub 的 required status check 是**按分支无条件**判定的。
#   若本工作流带 `paths: laiyipao/**`，那么一个只改 augmentor/ 的 PR
#   不会触发它 —— GitHub 看到的不是「通过」也不是「失败」，而是
#   **「Expected — waiting for status」**，PR 永远无法合并。
#
#   也就是说：`paths` 过滤与 required check 互斥。
#
#   代价是每个 PR 都会跑一遍 laiyipao 的三端（约 6~8 分钟，含双构建）。
#   oa4rust 那边没有改 —— 97 个 crate 全量跑太贵，先只用 laiyipao 做闸门。
#   若日后要把 ai-platform / oa4rust 的 job 也设为 required，
#   必须**先**去掉它们的 paths，否则会把仓库锁死。
name: laiyipao CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laiyipao-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Go 服务端：构建 + vet + 全量测试（带真库）────────────────────────────
  # ⚠️ 2026-10-10 起该 job 接 PostgreSQL service：此前无 PG 时约 259 个
  # DB 依赖用例整体 Skip，「全绿」里藏着没执行的代码 —— readonly_guard
  # 的「battles/1 必在」这类只在真实库结构下暴露的缺陷正是这样漏过去的
  # （全新库里首条战报 id 是 29，写死 1 的断言必红；本地实测已修）。
  # 库必须**迁移 + 播种**：httpapi/service 的 e2e 夹具直连 laiyipao 库，
  # 空库会在建号第一步就外键失败（本地实测：23503）。
  # 超时按 docs/OPERATIONS.md §5.2：11 个包并行打同一个 PG 会到 340s+，
  # 用 -timeout 1200s 防假性超时。
  server:
    name: Server build, vet & test (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: laiyipao/server
    services:
      # 测试夹具的默认 DSN 是 postgres://postgres@127.0.0.1:5432/laiyipao
      # （无密码，见 store_test.go / routes_e2e_test.go 的硬编码缺省），
      # 因此用 trust 认证而不是密码 —— 与 README 的开发库配置一致。
      # digest 钉法对齐 oa4rust-ci.yml；18 是本地全量实测过的版本。
      postgres:
        image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: laiyipao/server/go.mod
          cache-dependency-path: laiyipao/server/go.sum
      # 建库 + 迁移 + 播种。顺序即 README 快速开始的前三步；
      # ubuntu 镜像自带 psql 客户端，无需额外安装。
      - name: Prepare laiyipao database (create + migrate + seed)
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE laiyipao ENCODING 'UTF8';"
          go run ./cmd/migrate
          go run ./cmd/seed
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/laiyipao?sslmode=disable
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1 -timeout 1200s

  # ── admin 管理端（Vue3 + Vite）：类型检查 + 单测 + 构建 ─────────────────
  admin:
    name: Admin type-check, test & build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: laiyipao/admin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Activate pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          node --version
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm type-check
      - name: Type-check must actually fail on a type error
        run: |
          set -euo pipefail
          probe=src/api/__typecheck_probe.ts
          echo 'export const __probe: number = "not a number"' > "$probe"
          trap 'rm -f "$probe"' EXIT
          if pnpm type-check >/dev/null 2>&1; then
            echo "::error::type-check 在存在类型错误时仍然退出 0 —— 它没有真的在检查。"
            exit 1
          fi
      - name: Run Vitest tests
        run: pnpm test
      - name: Build (vue-tsc + vite)
        run: pnpm build
      - name: Size budget (first-load) must stay within budget
        # `pnpm size:check` 量的是**首屏**体积（index.html 入口的静态 import 闭包），
        # 不是 dist 总量 —— 路由是代码分割的，dist 总量会把懒加载页也算进来。
        #
        # ⚠️ 这一步以前不在 CI 里，于是「脚本烂掉」没人知道：
        # 2026-10-21 实测它的 entry 正则写死 `/assets/`，
        # 而 admin 的 vite base 是 `/laiyipao-admin/` → 永远匹配不到，
        # 脚本以退出码 2 结束（「找不到 entry 脚本」）。
        # 一个「量不出来」的闸门等于没有闸门 —— 放进 CI 才能让它坏掉时立刻红。
        run: pnpm size:check

  # ── miniapp 小程序端（uni-app）：类型检查 + 单测 + H5/微信双构建 ─────────
  # mp-weixin 构建对 vite 5.2.8 pin 敏感（依赖升级曾假红），进 CI 后回归可见。
  miniapp:
    name: Miniapp type-check, test & build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: laiyipao/miniapp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Activate pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          node --version
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm type-check
      # ⚠️ 「type-check 必须真的会检查」——2026-10-14 安全审计轮新增。
      #
      # 实测：miniapp 的 `vue-tsc` 曾锁在 2.0.22，而它与 TS 5.9 不兼容
      # （volar 2 靠 patch TypeScript 内部）。症状**不是**报错，而是
      #
      #     Search string not found: "/supportedTSExtensions = .*(?=;)/"
      #
      # 然后**退出码 0** —— 一个什么都没检查、却报告成功的 type-check。
      # 上面那步 `pnpm type-check` 跑的就是这个空操作，所以 miniapp 的类型
      # 检查在 CI 里**一直是假绿**，README 验证状态表那一行也跟着是假的。
      #
      # 修法是把 vue-tsc 升到 2.2.12。但版本会被 dependabot 再动一次，
      # 而这次的失效形态恰恰是「安静地不检查」——没有任何别的门禁会发现它。
      # 所以这一步才是真正的守卫：故意注入类型错误，断言 type-check **必须失败**。
      #
      # 为什么放 CI 而不是写成 vitest：它要真起一次 vue-tsc（约 30s），
      # 放进单测套会让每次本地跑测都多 30s，且失败原因与业务无关、难定位。
      - name: Type-check must actually fail on a type error
        run: |
          set -euo pipefail
          probe=src/api/__typecheck_probe.ts
          echo 'export const __probe: number = "not a number"' > "$probe"
          trap 'rm -f "$probe"' EXIT
          if pnpm type-check >/dev/null 2>&1; then
            echo "::error::type-check 在存在类型错误时仍然退出 0 —— 它没有真的在检查。"
            echo "最可能的原因：vue-tsc 与 typescript 版本不兼容（volar 2 的 TS patch 失效）。"
            echo "自查：npx vue-tsc --noEmit 2>&1 | grep -i 'search string not found'"
            exit 1
          fi
      - name: Run Vitest tests
        run: pnpm test
      - name: Build H5
        run: pnpm build:h5
      - name: Build WeChat mini program
        run: pnpm build:mp-weixin

  # ── 依赖漏洞闸门（2026-10-15 安全审计轮新增）────────────────────────────
  #
  # 为什么单独一个 job 而不是塞进上面三端：
  #
  # 1. **govulncheck 是硬闸门，必须 0。** 2026-10-15 审计在 go1.26.3 上
  #    扫出 **17 条代码可达**的 Go 标准库漏洞（net/http 8 条、crypto/tls 3 条、
  #    net/textproto 2 条，另有 crypto/x509 / encoding/xml / encoding/asn1 /
  #    net/url 各 1 条），全部修于 go1.26.9。那批里有 HTTP/2 内存耗尽、
  #    连接去同步、TLS 握手消息无上限等，都是**对外服务**的形状。
  #    改成 go.mod 一行 + 复扫归零，但工具链和漏洞库都会动，
  #    没有这道闸门，下一次 CVE 发布只会悄悄进来。
  #
  # 2. **pnpm audit 是回归闸门，不是「必须 0」。** 剩下的 39 条全挂在
  #    @dcloudio 构建链/测试链上，@dcloudio/vite-plugin-uni 声明的是
  #    `"vite": "5.2.8"` 这种精确 pin，强推版本会打破它、构建假红。
  #    实测产物（mp-weixin 223KB/60 文件、h5 387KB/29 文件）里一个漏洞包
  #    都没有，所以这里拿 audit-baseline.ini 当**上限**而不是目标值：
  #    涨了红（有人引入了新漏洞，或有人删了 overrides），降了提示去更新基线。
  #
  # 3. 放在一起是因为它们回答同一个问题——「现在这份依赖树有没有已知漏洞」，
  #    拆到三端各自的 job 里会让「基线文件改了」这件事看不出影响面。
  dependency-audit:
    name: Dependency vulnerability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: laiyipao/server/go.mod
          cache-dependency-path: laiyipao/server/go.sum
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Activate pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      # ── Go 侧：可达漏洞必须为 0 ──
      - name: govulncheck (must find no reachable vulnerability)
        working-directory: laiyipao/server
        run: |
          set -uo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # 这里**故意不加** set -e，也不用 govulncheck 的退出码当判据。
          #
          # 实测 govulncheck 找到漏洞时退出码是 3。在 set -euo pipefail 下，
          # `govulncheck ... | tee log` 会在管道处直接中断脚本，跑不到下面
          # 那段给修复指引的分支——CI 只会红，用户看到的是一个没有上下文的
          # 退出码 3，而不是「哪条漏洞、怎么修」。
          #
          # 判据统一交给 grep：'by 0' 不匹配 [1-9]，'by 17' 匹配。
          # 这样「红」这个结果永远带着人话。
          #
          # -show verbose 让「import 了但调不到」和「真的调得到」在日志里
          # 分得开，否则只剩一行汇总，看不出是哪条调用链。
          govulncheck -show verbose ./... | tee govulncheck.log
          if grep -qE "Your code is affected by [1-9]" govulncheck.log; then
            echo "::error::Go 依赖存在代码可达的已知漏洞（明细见上）。"
            echo "::error::最常见的修法是升 go.mod 的 go 指令——CI 用的是"
            echo "::error::go-version-file: laiyipao/server/go.mod，改那一行即可，go.sum 无需动。"
            echo "::error::若漏洞来自第三方模块而非标准库，先跑 govulncheck -show verbose 看调用链。"
            exit 1
          fi
          echo "govulncheck: 无代码可达的已知漏洞"
      # ── npm 侧：不得高于基线，且 overrides 必须还在 ──
      - name: Audit gates must not regress
        run: |
          set -uo pipefail
          fail=0
          for proj in miniapp admin; do
            cd "laiyipao/$proj"
            pnpm install --frozen-lockfile
            pnpm audit --json > audit.json || true
            node ../scripts/audit-gate.cjs check-counts "$proj" audit.json ../audit-baseline.ini || fail=1
            cd ../..
          done
          node laiyipao/scripts/audit-gate.cjs check-overrides \
            laiyipao/miniapp/pnpm-workspace.yaml laiyipao/audit-baseline.ini || fail=1
          exit $fail
      - name: Audit gates must actually fail when they should
        # 守卫的守卫。闸门写错时它会给出「已保护」的假象——比没有闸门更糟。
        # 本仓吃过一次「安静地不检查」的亏，见上面 miniapp 那步的注释。
        # 13 个变异用例覆盖：涨基线、新增 critical、admin 冒泡、基线段缺失、
        # 删/改 4 条 override、overrides 整段清空。
        run: node laiyipao/scripts/audit-gate.test.cjs
