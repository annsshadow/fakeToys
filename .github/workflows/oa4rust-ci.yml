name: CI
on:
  push:
    branches: [main, master]
    paths:
      - "oa4rust/backend/**"
      - ".github/workflows/oa4rust-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "oa4rust/backend/**"
      - ".github/workflows/oa4rust-ci.yml"
  # shared 行覆盖棘轮 job（shared-coverage）只在 workflow_dispatch 手动触发：
  # coverage 插桩构建吃不到 sccache 红利，挂到全量 push 会给每个推送加 10+ 分钟
  # （2026-10-29 评估，见 docs/plans/2026-10-27-comprehensive-test-coverage.md）。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oa4rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: oa4rust/backend
    env:
      # sccache 编译缓存：RUSTC_WRAPPER 把 rustc 调用代理给 sccache，
      # SCCACHE_GHA_ENABLED 启用 GitHub Actions cache 后端（缓存条目随
      # Cargo.lock/源码变化自动失效），避免每次 CI 全量重编。
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          # 钉 1.98.1：rustc 1.99.0（stable 2026-09-28）编译 openapi crate 触发
          # SIGSEGV（stack overflow ICE），CI 全部 rust job 失败；
          # 2026-09-30 main 门禁在 1.98.1 上全绿。
          toolchain: 1.98.1
          # minimal profile 默认不含 rustfmt/clippy，显式补齐（Check formatting /
          # Clippy 两步依赖这两个组件，缺了即 "cargo-fmt is not installed" 红）。
          components: clippy, rustfmt
      # sccache-action 安装 sccache 二进制；配合 job 级 env 的
      # RUSTC_WRAPPER=sccache + SCCACHE_GHA_ENABLED 走 GHA cache 后端。
      # 必须位于首个 cargo 调用（Cache cargo registry 之后的各 run）之前。
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('oa4rust/backend/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (lint + type-check, deny warnings)
        # clippy 是 cargo check 的超集：编译 --all-targets 全部目标并附加 lint，
        # -D warnings 将任意 clippy/rustc 告警升级为错误。基线 0 告警（2026-09-28 建立）。
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Designer route reconciliation (no DB)
        run: cargo test --test designer_route_match
      - name: Escaped-quote key guard (no DB)
        # 阶段 E6：禁止源码出现 "\"key\"" 形态字面量（键名里字面包含引号）。
        # 该缺陷曾造成 81 处 row.get panic(500) + 115 处响应键前端读不到。
        run: cargo test --test quoted_key_guard

  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: oa4rust/backend
    env:
      # sccache 编译缓存（同 quality job）：GHA cache 后端跨 run 复用编译产物。
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    services:
      # crates/shared/src/testing.rs 的 test_pool() 硬编码
      # postgres://o2server:password@localhost:5432/oa4rust，且 parity 的
      # behavior 契约测试（list_returns_array 断言 HTTP 200）会真实查库。
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: o2server
          POSTGRES_PASSWORD: password
          POSTGRES_DB: oa4rust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          # 钉 1.98.1：rustc 1.99.0（stable 2026-09-28）编译 openapi crate 触发
          # SIGSEGV（stack overflow ICE），CI 全部 rust job 失败；
          # 2026-09-30 main 门禁在 1.98.1 上全绿。
          toolchain: 1.98.1
      # sccache-action 安装 sccache 二进制；配合 job 级 env 的
      # RUSTC_WRAPPER=sccache + SCCACHE_GHA_ENABLED 走 GHA cache 后端。
      # 必须位于首个 cargo 调用（Cache cargo registry 之后的各 run）之前。
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('oa4rust/backend/Cargo.lock') }}
      # 空库无表时 handler 查库报错返回 500，会让 parity behavior 契约测试失败。
      # 复用项目内置迁移运行器（--migrate-only 在 src/main.rs 中实现），
      # 与生产启动路径一致，无需额外依赖外部迁移工具。
      - name: Apply migrations
        run: cargo run --bin oa4rust -- --migrate-only
        env:
          DATABASE_URL: postgres://o2server:password@localhost:5432/oa4rust
          DATABASE_DIALECT: postgres
      # 方言必须固定 postgres：本 job 的数据库依赖全部是 PostgreSQL
      # （test_pool()/test_sea_orm_pool() 硬编码 PG；运行时 create_pool() 也只用
      # deadpool_postgres）。此前这里传入 matrix 的 mysql 会让 handler 生成 `?`
      # 占位符发给 PostgreSQL → 语法错误 → 登录类用例返回 401。
      - name: Run unit tests
        # --no-fail-fast：默认遇到第一个 panic 就整包中止，日志里看不到是哪个目标挂的；
        # 带上它可让 cargo 继续跑完其余测试目标，便于定位真正的失败点。
        # tee 到文件：job 日志需要 admin 权限才能拉取，落盘后用 artifact 上传，
        # 便于在本地下载完整输出定位失败用例。
        # shell: bash + pipefail：确保 cargo 的非零退出码不会被 tee 吞掉。
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --lib --no-fail-fast 2>&1 | tee /tmp/unit-tests.log
        env:
          DATABASE_DIALECT: postgres
          DATABASE_URL: postgres://o2server:password@localhost:5432/oa4rust
          # 兜底：oa4rust/.cargo/config.toml 的 64MB 栈只对 Windows 主线程生效
          # （[target.x86_64-pc-windows-msvc] /STACK），Linux runner 上的测试线程
          # 走默认栈。构造巨型合并 Router 的用例已在源码中改用显式 64MB 栈线程，
          # 这里再抬高一档运行期默认值，避免其他用例触发同类栈溢出
          # （表现为 panic -> cargo test exit code 101）。
          RUST_MIN_STACK: "67108864"
          RUST_LOG: warn

      - name: Upload unit-test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oa4rust-unit-test-log
          path: /tmp/unit-tests.log
          if-no-files-found: warn

  integration-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: oa4rust/backend
    env:
      # sccache 编译缓存（同 quality job）：GHA cache 后端跨 run 复用编译产物。
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: o2server
          POSTGRES_PASSWORD: password
          POSTGRES_DB: oa4rust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          # 钉 1.98.1：rustc 1.99.0（stable 2026-09-28）编译 openapi crate 触发
          # SIGSEGV（stack overflow ICE），CI 全部 rust job 失败；
          # 2026-09-30 main 门禁在 1.98.1 上全绿。
          toolchain: 1.98.1
      # sccache-action 安装 sccache 二进制；配合 job 级 env 的
      # RUSTC_WRAPPER=sccache + SCCACHE_GHA_ENABLED 走 GHA cache 后端。
      # 必须位于首个 cargo 调用（Cache cargo registry 之后的各 run）之前。
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('oa4rust/backend/Cargo.lock') }}
      # 与 unit-tests 同理：cargo test -p parity --lib 的 behavior 契约测试
      # 会真实查库（test_pool() 硬编码 localhost:5432/oa4rust），空库无表时
      # handler 报错返回 500 → 41 个 parity 用例失败。此处先建表。
      - name: Apply migrations
        run: cargo run --bin oa4rust -- --migrate-only
        env:
          DATABASE_URL: postgres://o2server:password@localhost:5432/oa4rust
          DATABASE_DIALECT: postgres
      - name: Run parity tests (unit-only)
        run: cargo test -p parity --lib
        env:
          DATABASE_URL: postgres://o2server:password@localhost:5432/oa4rust
      - name: Run route-conflict probe (u2_probe)
        run: cargo test --test u2_probe
      - name: Run integration tests
        run: cargo test --test integration_runner
        env:
          DATABASE_DIALECT: postgres
          DATABASE_URL: postgres://o2server:password@localhost:5432/oa4rust

  # ── 启动冒烟：迁移 → 起服务 → /health ────────────────────────────────────
  # 2026-10-29：oa4rust 是**独立系统**，Java 契约奇偶不再是目标。
  # 原 behavior-compare / behavior-gate 两个 job 随之删除，理由（都是可核验的）：
  #   1. 比较器本体 `tests/behavior_compare.rs` **从未入仓**，「Run behavior
  #      comparison」一步恒发 notice 跳过；behavior-gate 只能靠「没有报告就
  #      exit 0」收场 —— 它从来没有真正拦过任何东西。
  #   2. behavior-compare 仍要拉一个 o2server(Java) 容器做双栈播种，冷启动约
  #      10 分钟，且结果随外部服务状态波动。
  # 其中唯一有真实覆盖价值的是「迁移 + 起服务 + /health」：迁移坏没坏、进程
  # 起不起得来，这两个问题与 Java 无关。保留成独立 job，成本不到 1 分钟。
  startup-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: oa4rust/backend
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      DATABASE_URL: postgres://o2server:password@localhost:5432/oa4rust
      DATABASE_DIALECT: postgres
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: o2server
          POSTGRES_PASSWORD: password
          POSTGRES_DB: oa4rust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          # 与 integration-tests 同钉 1.98.1（1.99.0 编译 openapi crate 会 ICE）。
          toolchain: 1.98.1
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('oa4rust/backend/Cargo.lock') }}
      - name: Apply migrations
        run: cargo run --bin oa4rust -- --migrate-only
      - name: Boot the server and assert /health
        # 判据：进程活着 **且** /health 返回 2xx。只断言「进程没退出」会漏掉
        # 「监听起来了但路由没挂」；只断言 curl 成功会漏掉「起来又崩」。
        run: |
          set -euo pipefail
          cargo build --bin oa4rust
          ./target/debug/oa4rust &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/health; then
              echo "::notice::/health OK after ${i}s"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::server exited before becoming healthy"
              exit 1
            fi
            sleep 1
          done
          echo "::error::server did not answer /health within 60s"
          exit 1

  # ── plan002 U9 / R8: OpenAPI 安全方案守卫 ────────────────────────────────────
  # scripts/gen_openapi_paths.py 重新生成 OpenAPI lib.rs 时，会把 Bearer 安全方案
  # 注入到 securitySchemes。若注入静默丢失，API 文档将缺少鉴权信息且难以察觉。
  # 本 job 校验已纳入版本控制的生成产物（crates/openapi/src/lib.rs）确实含有
  # 安全方案注入。若后续 CI 加入“重新生成 OpenAPI”步骤，应在该步骤之后再加一次
  # 本断言（即先 regenerate 再 check）。
  openapi-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: oa4rust/backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"
      - name: Verify OpenAPI security scheme is present
        run: python scripts/check_openapi_security.py

  # FI-002 静态列扫描（2026-10-25，OA-FI002-CI 收口）
  #
  # FI-002 那轮用「代码 SQL 字面量 vs live PG information_schema」对撞，一次挖出
  # 约 50 个运行时必然 500 的 handler。方法有效但只活在文档里——本 job 把它固化为
  # 无需活库的静态版：解析 migrations/*.sql 得 (table, column) 宇宙，扫
  # crates/*/src 的 SQL 字面量，与 docs/audits/artifacts/fi002_unknown_columns.tsv
  # 基线做**棘轮**（新增未知对即红；缺口修掉会提示收敛）。
  #
  # 与 live-DB 版的分工：静态版保证「migrations 与代码 SQL 不脱节」这一必要条件，
  # 覆盖不了权限/数据问题；它跑在每次 push，成本秒级。
  fi002-column-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: oa4rust/backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"
      - name: FI-002 static column scan (ratchet against baseline)
        run: python scripts/fi002_column_scan.py

  # L-REST 无界 SELECT 静态扫描（2026-10-27 建立；2026-10-28 修订，§6/§6.5 收口）
  #
  # 与 FI-002 同源：复用 rust_literals() / SRC_ROOTS，不另造一套 SQL 字面量
  # 提取器。区别是它不碰 migrations，只按**顶层 SQL 形状**分桶，把「没有
  # LIMIT/FETCH」的列表查询单独记账，并与
  # docs/audits/artifacts/limit_unbounded.tsv 做文件级棘轮：
  # 新文件出现 unbounded / parent_key、或既有文件计数增加即红；修掉一条会提示收敛。
  #
  # 分桶：bounded / aggregate / single_row（身份键约定 id|xid|unique_id，或 ≥2 个 *_id
  # 复合身份）/ parent_key（单个非身份 *_id，父键取子列表，需逐端点决策）/ key_set /
  # scalar / subquery / unbounded。基线同时登记 unbounded（617 条）+ parent_key（113 条）。
  # 10-28 修订还排除了 11 个 security_gate_tests.rs（83 条测试 SQL 不再入产品面）。
  # 本轮在 BBS 别名 + 消息/流程 12 处列表加 LIMIT 100；导出/聚合/全遍历不盲改
  # （见计划 §6.3 / §6.5 决策表）。扫描器自身有总字面量/文件数/分桶地板，防止
  # 「正则坏了、什么都没扫到」被当成绿。
  limit-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: oa4rust/backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"
      - name: L-REST unbounded / parent_key SELECT scan (ratchet against baseline)
        run: python scripts/limit_scan.py

  # shared 行覆盖棘轮（2026-10-29 落地，workflow_dispatch 手动触发，见文件头说明）。
  # 台账：docs/plans/2026-10-27-comprehensive-test-coverage.md 的 shared 行
  # （2026-10-29 实测 93.28%（容器）/93.1% 上下（本 job，工具链插桩差 ~0.1pt），地板 93/92.5；本地复跑方式：oa4rust-cov 容器内
  # cargo llvm-cov -p shared --lib --summary-only）。
  shared-coverage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: oa4rust/backend
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: o2server
          POSTGRES_PASSWORD: password
          POSTGRES_DB: oa4rust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          # llvm-cov 依赖 llvm-tools 组件（minimal profile 默认不含）
          components: llvm-tools
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('oa4rust/backend/Cargo.lock') }}
      - name: Install pinned scanner
        run: |
          set -euo pipefail
          cargo install --locked cargo-llvm-cov --version 0.9.1
          cargo llvm-cov --version
      - name: Apply migrations
        run: cargo run --bin oa4rust -- --migrate-only
        env:
          DATABASE_URL: postgres://o2server:password@localhost:5432/oa4rust
          DATABASE_DIALECT: postgres
      - name: Shared line coverage ratchet (>= 92.5, 容器口径 93.28)
        run: |
          set -euo pipefail
          DATABASE_URL=postgres://o2server:password@localhost:5432/oa4rust \
            cargo llvm-cov -p shared --lib --summary-only | tee /tmp/cov.txt
          LINE_PCT=$(awk '/^TOTAL/ {gsub(/%/,"",$10); print $10}' /tmp/cov.txt)
          echo "shared 行覆盖：${LINE_PCT}%"
          # 台账地板 92 以 oa4rust-cov 容器（cargo 1.99.1）实测为准；本 job 用 1.98.1，
          # 插桩行数有 ~0.1pt 工具链差异（2026-10-29 双实测：容器 92.02 / 本 job 91.93），
          # 故 CI 断言留 0.7pt 工具链余量（92.5）——低于它说明覆盖真回退了。
          # 与台账地板对撞；抬高地板前先看台账的「下一轮」约定（92 → 94 → 上限 95.6）。
          awk -v pct="${LINE_PCT}" 'BEGIN { if (pct+0 < 92.5) { print "::error::shared 行覆盖 " pct "% 低于地板 92.5%（容器口径 93.28）"; exit 1 } }'
