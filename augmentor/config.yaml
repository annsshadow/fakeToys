# AI 训练数据增强工具配置文件

# 应用配置
app:
  name: ai-augmentor
  version: "1.0"
  debug: false

# 模型配置
models:
  # 默认使用的模型
  default: ernie
  
  # 百度 ERNIE 配置
  ernie:
    type: baidu
    api_key: ${BAIDU_API_KEY}
    secret_key: ${BAIDU_SECRET_KEY}
    model: ernie-3.5-8k
    temperature: 0.99
    top_p: 0.95
    max_output_tokens: 2048
  
  # OpenAI 配置
  openai:
    type: openai
    api_key: ${OPENAI_API_KEY}
    model: gpt-3.5-turbo
    temperature: 0.99
    top_p: 0.95
    max_output_tokens: 2048
  
  # 本地模型配置 (Ollama)
  ollama:
    type: ollama
    base_url: http://localhost:11434
    model: qwen2:7b
    temperature: 0.99
    top_p: 0.95
    max_output_tokens: 2048
  
  # Anthropic Claude 配置
  claude:
    type: claude
    api_key: ${ANTHROPIC_API_KEY}
    base_url: https://api.anthropic.com
    model: claude-3-5-sonnet-20241022
    temperature: 0.99
    top_p: 0.95
    max_output_tokens: 2048
  
  # Google Gemini 配置
  gemini:
    type: gemini
    api_key: ${GOOGLE_API_KEY}
    base_url: https://generativelanguage.googleapis.com
    model: gemini-1.5-flash
    temperature: 0.99
    top_p: 0.95
    max_output_tokens: 2048

# 增强配置
augmentation:
  # 每条 seed 生成的变体数量
  variants_per_seed: 5
  
  # 并发线程数
  num_threads: 40
  
  # 自动保存间隔（每 N 条）
  auto_save_interval: 10
  
  # 模型调用的总尝试次数（含首次，不是「额外重试次数」）；0 = 只调用一次不重试
  # 越界（负数 / 布尔 / 字符串 / >20）在流水线构造处判掉，不降级为无模型模式
  max_retries: 3
  
  # 退避基数（秒）：第 n 次等待 ≈ retry_delay × 2^(n-1)，退避计算那一支再被 30 s 夹住
  # 0–60 之间，int 写法（如 1）与 float 写法（如 1.0）都合法
  # 但限流时不等这个数：服务端回 `Retry-After` 就照它的秒数等，那一支 30 s 夹不住 ——
  # 它的上限是下面那个 `max_retry_wait`（默认 300 s）
  retry_delay: 1

  # 「服务端指令」那一支的等待上限（秒），0–300，int / float 写法都合法
  # **只能夹小不能放大**：300 s 是 `retry.MAX_RETRY_AFTER` 对外的承诺，
  # 写 301 会在流水线构造处判掉（不降级为无模型模式）
  # 调小它是「我宁可早点放弃，也不要挂住 10 分钟」的开关；0 读作
  # 「不再尊重服务端指令、失败就立刻重发」，一般只该出现在测试里
  max_retry_wait: 300

  # 退避随机抖动比例，0–1 闭区间；默认 0 = 不抖，各档等待与接参前逐字相同
  # 并发（`num_threads`）打同一后端时非 0 才有意义：同一档退避会让所有线程
  # 同时醒来再撞一次 429，抖动把它们错开
  # 代价：退避一支的最坏单次等待从 30 s 变成 30 × (1 + retry_jitter) s（0.5 ⇒ 45 s）
  retry_jitter: 0

# 质量评分配置
quality:
  # 启用质量评分
  enabled: true
  
  # 质量阈值（低于此分数的样本被过滤）
  threshold: 0.6
  
  # 评分权重 [语义相似度, 回答相关性, 多样性]
  weights: [0.3, 0.4, 0.3]

# 去重配置
dedup:
  # 启用智能去重
  enabled: true
  
  # 相似度阈值（高于此值被视为重复）
  threshold: 0.9

# 导出配置
export:
  # 默认导出格式
  default_format: jsonl
  
  # 支持的导出格式
  formats:
    - jsonl
    - llama_factory
    - alpaca
    - sharegpt
    - chatml

# 对话上下文配置
context:
  # 启用对话上下文增强
  enabled: false
  
  # 对话轮数
  num_turns: 3

# 版本管理配置
versioning:
  # 启用版本管理
  enabled: true
  
  # 版本存储目录
  storage_dir: data/versions
  
  # 自动快照（增强完成后）
  auto_snapshot: true

# 主动学习配置
sampler:
  # 启用主动学习选样
  enabled: false
  
  # 分析维度
  dimensions:
    - topic
    - question_type
    - length
    - complexity

# 领域扩展配置
expander:
  # 启用自动领域扩展
  enabled: false
  
  # 扩展策略
  strategies:
    - similar
    - related
    - scenario

# 效果追踪配置
tracker:
  # 启用微调效果追踪
  enabled: false
  
  # 追踪指标
  metrics:
    - train_loss
    - eval_accuracy
    - perplexity

# 可视化配置
visualization:
  # 启用数据可视化
  enabled: true
  
  # 可视化类型
  types:
    - wordcloud
    - length_distribution
    - topic_cluster
    - timeline
    - quality_distribution

# 多语言配置
multilingual:
  # 启用多语言支持
  enabled: false
  
  # 默认目标语言
  default_target_lang: en
  
  # 支持的语言
  supported_langs:
    - zh
    - en
  
  # 批量翻译大小
  translate_batch_size: 10

# RAG 训练数据配置
rag:
  # 启用 RAG 数据格式
  enabled: false
  
  # 默认格式 (llamaindex / langchain / custom)
  default_format: llamaindex
  
  # 分块大小（字符数）
  chunk_size: 512
  
  # 分块重叠
  chunk_overlap: 64

# 模型评估配置
evaluation:
  # 启用模型评估
  enabled: false
  
  # 评估指标
  metrics:
    - bleu
    - rouge_l
    - similarity
  
  # 参考文本字段
  reference_field: output

# 向量数据库配置
vector:
  # 启用向量数据库
  enabled: false
  
  # 后端 (faiss / chromadb)
  backend: faiss
  
  # 向量维度
  dimension: 384
  
  # 存储目录
  storage_dir: data/vectors
  
  # 集合名称
  collection: default

# 多模态数据配置
multimodal:
  # 启用多模态处理
  enabled: false
  
  # 支持的图像扩展名
  image_extensions:
    - .jpg
    - .jpeg
    - .png
    - .bmp
    - .webp
  
  # 支持的音频扩展名
  audio_extensions:
    - .wav
    - .mp3
    - .flac
    - .ogg
    - .m4a

# 数据质量基准配置
benchmark:
  # 启用质量基准
  enabled: false
  
  # 基准文件路径
  baseline_file: data/benchmark_baseline.json
  
  # 基准指标
  metrics:
    - pass_rate
    - avg_total_score
    - diversity
    - duplication_rate

# 主动学习循环配置
active_learning:
  # 启用主动学习
  enabled: false
  
  # 采样策略 (uncertainty / diversity / hybrid / random)
  strategy: uncertainty
  
  # 每轮选择的样本数
  batch_size: 50
  
  # 最大迭代轮数
  max_iterations: 10

# LLM 框架集成配置
frameworks:
  # 启用框架集成
  enabled: false
  
  # 集成的框架
  frameworks:
    - langchain
    - llamaindex

# Web UI 配置
web:
  # 服务端口
  port: 8000
  
  # 服务地址
  host: 0.0.0.0
  
  # 静态文件目录
  static_dir: web/dist
  
  # 允许跨源调用本 API 的来源白名单（精确匹配 Origin 头）。
  # 出厂默认是**空列表 = 不发任何 CORS 头**：随包 Web UI 与后端同源（axios baseURL
  # 是相对路径 `/api`，vite 开发模式走 proxy），因此它不需要 CORS；curl / Python SDK
  # 等非浏览器客户端也不受 CORS 约束。只有「跑在别的站点上的浏览器页面要调本 API」
  # 这种用法才需要在这里列出来源。
  # 旧默认 `["*"]` 配 `cors_credentials: true` 在 starlette 下会把请求方 Origin 原样
  # 回显并回 `access-control-allow-credentials: true`（预检一并放行）⇒ 等于任意网站
  # 都能带用户凭据读本 API，故收紧。
  # 这是 3.x 的**破坏性默认变更**：确有跨源前端的话，改成
  # `cors_origins: ["https://your-frontend.example"]` 即可恢复。
  cors_origins: []
  
  # 是否允许跨源请求携带凭据（cookie / Authorization）。本仓 API 不用 cookie，
  # 鉴权走 `X-API-Key` 头，所以这一项对合法用法没有收益；仅在确实需要跨源带
  # 凭据时显式打开，并且 `cors_origins` 必须是精确白名单（不能留空）。
  cors_credentials: false
  
  # REST API 允许访问的目录白名单。
  # 客户端传入的文件/目录路径 resolve 后必须落在其中某个根目录内，否则返回 403。
  # 相对路径先在白名单各根目录内查找已存在的文件（所以裸文件名能用），找不到才按
  # 进程工作目录解释；写入新文件必须显式给出白名单内的路径，如 "data/out.json"。
  # 出厂默认只放行数据目录（与 docker 的 /app/data 卷一致），工作目录下的其它文件
  # （配置、备份目录）对 API 不可见。放宽需谨慎：每多一个根目录，可读写的范围
  # 就多出整棵子树。
  # 环境变量 AUGMENTOR_DATA_ROOTS（os.pathsep 分隔）优先级高于此处。
  data_roots:
    - "data"
  
  # 滑动窗口限流：窗口内单客户端（按 IP）最大请求数，0 表示关闭限流。
  # 超限返回 429 并带 Retry-After 头。
  rate_limit_max_requests: 300
  
  # 限流窗口长度（秒）
  rate_limit_window_seconds: 60.0
  
  # 免限流路径（前缀匹配）。健康检查被容器探针高频调用，必须豁免。
  rate_limit_exempt_paths:
    - /api/health
    - /docs
    - /redoc
    - /openapi.json

# 日志配置
logging:
  # 日志级别
  level: INFO
  
  # 日志文件
  file: app.log
  
  # 日志格式
  format: "%(asctime)s - %(levelname)s - %(message)s"
