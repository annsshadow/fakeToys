# AI 训练数据增强工具配置文件

# 应用配置
app:
  name: ai-augmentor
  version: "1.0"
  debug: false

# 模型配置
models:
  # 默认使用的模型
  default: ernie
  
  # 百度 ERNIE 配置
  ernie:
    type: baidu
    api_key: ${BAIDU_API_KEY}
    secret_key: ${BAIDU_SECRET_KEY}
    model: ernie-3.5-8k
    temperature: 0.99
    top_p: 0.95
    max_output_tokens: 2048
  
  # OpenAI 配置
  openai:
    type: openai
    api_key: ${OPENAI_API_KEY}
    model: gpt-3.5-turbo
    temperature: 0.99
    top_p: 0.95
    max_output_tokens: 2048
  
  # 本地模型配置 (Ollama)
  ollama:
    type: ollama
    base_url: http://localhost:11434
    model: qwen2:7b
    temperature: 0.99
    top_p: 0.95
    max_output_tokens: 2048
  
  # Anthropic Claude 配置
  claude:
    type: claude
    api_key: ${ANTHROPIC_API_KEY}
    base_url: https://api.anthropic.com
    model: claude-3-5-sonnet-20241022
    temperature: 0.99
    top_p: 0.95
    max_output_tokens: 2048
  
  # Google Gemini 配置
  gemini:
    type: gemini
    api_key: ${GOOGLE_API_KEY}
    base_url: https://generativelanguage.googleapis.com
    model: gemini-1.5-flash
    temperature: 0.99
    top_p: 0.95
    max_output_tokens: 2048

# 增强配置
augmentation:
  # 每条 seed 生成的变体数量
  variants_per_seed: 5
  
  # 并发线程数
  num_threads: 40
  
  # 自动保存间隔（每 N 条）
  auto_save_interval: 10
  
  # 重试次数
  max_retries: 3
  
  # 重试间隔（秒）
  retry_delay: 1

# 质量评分配置
quality:
  # 启用质量评分
  enabled: true
  
  # 质量阈值（低于此分数的样本被过滤）
  threshold: 0.6
  
  # 评分权重 [语义相似度, 回答相关性, 多样性]
  weights: [0.3, 0.4, 0.3]

# 去重配置
dedup:
  # 启用智能去重
  enabled: true
  
  # 相似度阈值（高于此值被视为重复）
  threshold: 0.9

# 导出配置
export:
  # 默认导出格式
  default_format: jsonl
  
  # 支持的导出格式
  formats:
    - jsonl
    - llama_factory
    - alpaca
    - sharegpt
    - chatml

# 对话上下文配置
context:
  # 启用对话上下文增强
  enabled: false
  
  # 对话轮数
  num_turns: 3

# 版本管理配置
versioning:
  # 启用版本管理
  enabled: true
  
  # 版本存储目录
  storage_dir: data/versions
  
  # 自动快照（增强完成后）
  auto_snapshot: true

# 主动学习配置
sampler:
  # 启用主动学习选样
  enabled: false
  
  # 分析维度
  dimensions:
    - topic
    - question_type
    - length
    - complexity

# 领域扩展配置
expander:
  # 启用自动领域扩展
  enabled: false
  
  # 扩展策略
  strategies:
    - similar
    - related
    - scenario

# 效果追踪配置
tracker:
  # 启用微调效果追踪
  enabled: false
  
  # 追踪指标
  metrics:
    - train_loss
    - eval_accuracy
    - perplexity

# 可视化配置
visualization:
  # 启用数据可视化
  enabled: true
  
  # 可视化类型
  types:
    - wordcloud
    - length_distribution
    - topic_cluster
    - timeline
    - quality_distribution

# 多语言配置
multilingual:
  # 启用多语言支持
  enabled: false
  
  # 默认目标语言
  default_target_lang: en
  
  # 支持的语言
  supported_langs:
    - zh
    - en
  
  # 批量翻译大小
  translate_batch_size: 10

# RAG 训练数据配置
rag:
  # 启用 RAG 数据格式
  enabled: false
  
  # 默认格式 (llamaindex / langchain / custom)
  default_format: llamaindex
  
  # 分块大小（字符数）
  chunk_size: 512
  
  # 分块重叠
  chunk_overlap: 64

# 模型评估配置
evaluation:
  # 启用模型评估
  enabled: false
  
  # 评估指标
  metrics:
    - bleu
    - rouge_l
    - similarity
  
  # 参考文本字段
  reference_field: output

# 向量数据库配置
vector:
  # 启用向量数据库
  enabled: false
  
  # 后端 (faiss / chromadb)
  backend: faiss
  
  # 向量维度
  dimension: 384
  
  # 存储目录
  storage_dir: data/vectors
  
  # 集合名称
  collection: default

# 多模态数据配置
multimodal:
  # 启用多模态处理
  enabled: false
  
  # 支持的图像扩展名
  image_extensions:
    - .jpg
    - .jpeg
    - .png
    - .bmp
    - .webp
  
  # 支持的音频扩展名
  audio_extensions:
    - .wav
    - .mp3
    - .flac
    - .ogg
    - .m4a

# 数据质量基准配置
benchmark:
  # 启用质量基准
  enabled: false
  
  # 基准文件路径
  baseline_file: data/benchmark_baseline.json
  
  # 基准指标
  metrics:
    - pass_rate
    - avg_total_score
    - diversity
    - duplication_rate

# 主动学习循环配置
active_learning:
  # 启用主动学习
  enabled: false
  
  # 采样策略 (uncertainty / diversity / hybrid / random)
  strategy: uncertainty
  
  # 每轮选择的样本数
  batch_size: 50
  
  # 最大迭代轮数
  max_iterations: 10

# LLM 框架集成配置
frameworks:
  # 启用框架集成
  enabled: false
  
  # 集成的框架
  frameworks:
    - langchain
    - llamaindex

# Web UI 配置
web:
  # 服务端口
  port: 8000
  
  # 服务地址
  host: 0.0.0.0
  
  # 静态文件目录
  static_dir: web/dist

# 日志配置
logging:
  # 日志级别
  level: INFO
  
  # 日志文件
  file: app.log
  
  # 日志格式
  format: "%(asctime)s - %(levelname)s - %(message)s"
