[pytest]
testpaths = tests
addopts =
    -ra
    --strict-markers
    --cov=augmentor
    --cov=api
    --cov=cli
    ; 分支覆盖：只看语句覆盖会漏掉「条件写反但每行都执行到」这类缺陷。
    ; 实测行 99.99% / 分支 99.98%，总覆盖 99.99%（2026-10-28 全量复跑）。
    ; 阈值钉在 99：低于实测值 0.99 个点，只允许噪声级波动，回退即红。
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=xml:coverage.xml
    --cov-fail-under=99
