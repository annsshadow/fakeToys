[pytest]
testpaths = tests
addopts =
    -ra
    --strict-markers
    --cov=augmentor
    --cov=api
    --cov=cli
    ; 分支覆盖：只看语句覆盖会漏掉「条件写反但每行都执行到」这类缺陷。
    ; 实测语句 99.50% / 分支 98.63%，阈值 80 对两者都成立。
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
