# AI 数据平台（augmentor）· 测试环境 nginx location 片段
# 部署位置：/etc/nginx/conf.d/augmentor/*.conf（不挂进 ccy.conf，避免 HTTPS 白名单校验阻断 API 请求）
# 目标 VHost：home.conf（listen 80 + 443 ssl default_server，<YOUR_TEST_DOMAIN> 会解析到这里）
# 安装方式：mkdir -p /etc/nginx/conf.d/augmentor && cp 本文件 /etc/nginx/conf.d/augmentor/10-test.conf
#           在 home.conf 的 server 块内（location 区）加一行：
#             include /etc/nginx/conf.d/augmentor/*.conf;
# 真值（域名/口令）从部署环境变量读取，不写在本文件。

# API → 后端容器 :8000（剥离 /augmentor-api/ 前缀）
location /augmentor-api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 64m;
}

# 前端 SPA（/augmentor/，Vite base=/augmentor/ 构建产物）
location = /augmentor { return 301 /augmentor/; }

location ^~ /augmentor/assets/ {
    alias <远端前端目录>/augmentor/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location /augmentor/ {
    alias <远端前端目录>/augmentor/;
    index index.html;
    try_files $uri $uri/ /augmentor/index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
