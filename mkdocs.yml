# 文档站配置 —— 只发布 docs/ 下的 laiyipao / llm-lab / oa4rust 三个目录。
# 本地预览：.venv-docs/Scripts/python.exe -m mkdocs serve
# 本地构建：.venv-docs/Scripts/python.exe -m mkdocs build --strict
# 发布：    推送到 main，GitHub Actions 自动构建并部署到 GitHub Pages。
site_name: fakeToys 文档
site_description: laiyipao / llm-lab / oa4rust 项目文档
site_author: annsshadow
# 仓库完整名从环境变量读取，本地开发时回退为占位符，避免写死。
repo_url: !ENV [MKDOCS_REPO_URL, "https://github.com/<OWNER>/<REPO>"]
repo_name: annsshadow/fakeToys
copyright: Copyright (C) 2026 annsshadow · AGPL-3.0-or-later

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

# 只发布下面三个目录。其余 docs/ 内容（计划、审计、brainstorm、solutions 等）
# 一律排除 —— 这是"白名单"之外的显式黑名单，新增顶层目录必须同步加进来，
# CI 里还有一道产物校验（见 .github/workflows/docs.yml）。
exclude_docs: |
  /archived-plans/
  /assets/
  /audits/
  /augmentor/
  /brainstorms/
  /feasibility-reviews/
  /linux-7.1.3/
  /ops/
  /plans/
  /solutions/
  /tech-debt.md
  /**/CLAUDE.md
  /**/AGENTS.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - zh
        - en

# 全站导航树。nav 未列出的文件不会被收录（--strict 下会报 warning），
# 想新增页面时在这里补一行即可。
nav:
  - 首页: index.md
  - 来一炮(laiyipao):
      - 总览: laiyipao/README.md
      - 游戏设计: laiyipao/GAME_DESIGN.md
      - 实现内容与验证: laiyipao/IMPLEMENTATION.md
      - 工程约束: laiyipao/ENGINEERING.md
      - 决策记录: laiyipao/DECISIONS.md
      - 已知限制: laiyipao/KNOWN_LIMITS.md
      - 运维手册: laiyipao/OPERATIONS.md
      - 系统设计:
          - 总览: laiyipao/system/README.md
          - 01 架构: laiyipao/system/01-architecture.md
          - 02 服务端: laiyipao/system/02-server.md
          - 03 小程序: laiyipao/system/03-miniapp.md
          - 04 管理后台: laiyipao/system/04-admin.md
          - 05 API 参考: laiyipao/system/05-api-reference.md
          - 06 数据模型: laiyipao/system/06-data-model.md
          - 07 部署: laiyipao/system/07-deployment.md
          - 08 契约: laiyipao/system/08-contracts.md
      - 审计与复盘:
          - 覆盖率 2026-09-28: laiyipao/audits/coverage-2026-09-28.md
          - 覆盖率 2026-10-28: laiyipao/audits/coverage-2026-10-28.md
          - 安全性 2026-10-13: laiyipao/audits/security-2026-10-13.md
          - 引擎移植计划: laiyipao/audits/r1-engine-port-plan.md
  - LLM 实验(llm-lab):
      - 学习路线: llm-lab/00-学习路线.md
      - 01 分词与词表: llm-lab/01-分词与词表.md
      - 02 嵌入与位置编码: llm-lab/02-嵌入与位置编码.md
      - 03 自注意力机制: llm-lab/03-自注意力机制.md
      - 04 Transformer 结构: llm-lab/04-Transformer结构.md
      - 05 预训练与训练循环: llm-lab/05-预训练与训练循环.md
      - 06 规模化训练: llm-lab/06-规模化训练.md
      - 07 微调 SFT/LoRA/QLoRA: llm-lab/07-微调-SFT-LoRA-QLoRA.md
      - 08 对齐 RLHF/PPO/DPO: llm-lab/08-对齐-RLHF-PPO-DPO.md
      - 09 评估: llm-lab/09-评估.md
      - 10 推理优化: llm-lab/10-推理优化.md
  - OA4Rust:
      - 总览: oa4rust/README.md
      - 01 架构: oa4rust/01-architecture.md
      - 02 模块: oa4rust/02-modules.md
      - 03 数据与接口: oa4rust/03-data-and-api.md
      - 04 流程: oa4rust/04-flows.md
      - 05 环境: oa4rust/05-environment.md
      - 06 安装与运行: oa4rust/06-install-and-run.md
      - 07 示例: oa4rust/07-examples.md
      - 08 FAQ: oa4rust/08-faq.md
      - 09 维护: oa4rust/09-maintenance.md
