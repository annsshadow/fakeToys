# 依赖漏洞基线（2026-10-27 第四轮实测）
#
# 用途：CI 的 dependency-audit job 拿它当**回归闸门**——任一严重度计数
# 超过下面这个数就红；低于它就提示回来更新本文件（否则这次修复没留下守卫）。
#
# 演变（每一轮都留读数，别美化）：
#   2026-10-15  39 条（3/13/16/7）——立基线，全部挂在 @dcloudio 构建链/测试链。
#   2026-10-22 上午  47 条（3/16/20/8）——漏洞库新发布一批 advisory，CI 变红，
#               两个 dependabot PR（#100 vite / #101 follow-redirects）一起被挡住。
#   2026-10-22 下午  3 条（0/1/2/0）——按「能真修就真修」逐条处置：
#               overrides 顶掉 44 条（详见 miniapp/pnpm-workspace.yaml 的分组注释），
#               其中 vite 5.4.21→6.4.4、vitest 2.1.9→4.1.12 是两次跨大版本，
#               依据是 oa4rust/mobile 的同一套 dcloudio 工具链已在 vite 6 上长期全绿。
#   2026-10-27  0 条（0/0/0/0）——第四轮，Dependabot 24 条 open 告警的收尾：
#               - phin 2.9.3 → override 3.7.1（GHSA-x565，见 miniapp yaml 注释）。
#                 上一轮把这条记成「phin 3.7.1 无修复版本」是读错了：公告的
#                 受影响区间是 <3.7.1，真正命中的是树里那份 2.9.3。
#               - body-parser 1.20.6 → 1.20.9（GHSA-27r3）。
#               - vite 声明值 5.2.8 → 6.4.4，与 override 对齐。此前声明 5.2.8 /
#                 实装 6.4.4，dependabot 按声明值一次报了 20 条早已修掉的漏洞。
#               上一轮记的 braces / sprintf-js 两条已不再命中（依赖树变动）。
#   2026-10-28  1 条（0/0/0/1）——deepmerge 4.3.1 原型污染公告（mergeObject）：
#               受影响区间 >=4.2.0 <=4.3.1，上游最新即 4.3.1、无补丁版本，
#               降级到区间外的 4.1.x 会打破 jest-config@27.5.1 的 ^4.2.2 声明；
#               仅经 jest-config ← jest ← @dcloudio/uni-automator（dev 链）进入，
#               dist/build/{mp-weixin,h5} 特征串扫描 0 命中。与 fd60f5da7 在
#               GitHub 侧的 dismiss（tolerable_risk）是同一决策，本文件此前没同步。
#               上游发补丁后回到 0。
#   2026-11-01  1 条（0/0/0/1）——漏洞库新发布一批 advisory（@intlify 9.14.5
#               escapeParameter XSS、vite 6.4.4 fs.deny 绕过、follow-redirects 1.16.1
#               跨域敏感头数组丢弃、minimatch globparts 放大、glob AbortSignal 绕过），
#               miniapp 计数一度涨到 8（3 high / 3 moderate / 2 low）、admin 涨到 2。
#               逐条处置：@intlify 三件套 9.14.5 → 11.4.16、vite 6.4.4 → 6.4.5、
#               follow-redirects 1.16.1 → 1.16.2，并新增 minimatch 11.0.1 / glob 14.0.2
#               （miniapp 与 admin 两侧）。版本取自 oa4rust/mobile 已验证的同一套
#               @dcloudio 工具链。处置后 miniapp 回到 1（deepmerge）、admin 回到 0。
#   2026-11-12  1 条（0/0/0/1）——**计数一格未动，动的是 overrides 名册**：
#               `f7d15a76e`（fix(miniapp): vue 运行时家族回 3.4.21 修 uni-h5-vue 兼容
#               ——登录跳转失效与战斗画面冻结）把 vue 运行时家族（vue / compiler-* /
#               reactivity / runtime-* / shared）**从 3.5.42 回钉到 3.4.21**，
#               而 `@vue/server-renderer` 单独留在 3.5.42（只在构建期被 uni-cli-shared
#               消费、不进产物，GHSA-g2v6 的修复保留）——**那一笔没有同步本文件的
#               `[miniapp.overrides]` 段** ⇒ overrides 在位闸门（`check-overrides`）
#               逐条点名那 9 只「不在 pnpm-workspace.yaml 里了」⇒ CI 的
#               `Audit gates must not regress` 那一步**自 2026-11-11 起一直红**。
#               本次处置：把名册里那 9 只改成现值 **3.4.21**（**不是放宽闸门**——
#               闸门查的就是「override 还在不在、版本对不对」，名册记的是**现值**，
#               记旧值只会让闸门永远红；真正的安全性由 `pnpm-workspace.yaml` 那段
#               注释里的理由兜着：3.5.x 与 uni-app 的 fork 不兼容，回写 3.4.21 是
#               **运行时正确性**的要求，漏洞面按 2026-10-22 的实测判定为不进产物）。
#               miniapp / admin 的**漏洞计数**两格一格未动（1 / 0）。
#
# 改这个文件前先确认两件事：
#   1. 新增的确实是构建期/测试期依赖，没有一个进 mp-weixin 或 h5 产物
#      （在 dist/build/{mp-weixin,h5} 里搜该包的特征串，命中即不可放宽）
#   2. 有 @dcloudio 上游发版或别的办法能真正修掉它 —— 有就修，别抬基线
#
# 修好一条就从这里减一条，并把 pnpm-workspace.yaml 的 overrides 记上。
[miniapp]
critical = 0
high = 0
moderate = 0
low = 1
total = 1

[admin]
critical = 0
high = 0
moderate = 0
low = 0
total = 0

# 下面这些是 miniapp/pnpm-workspace.yaml 里 overrides 钉住的版本。
# 少任何一条，计数会立刻涨回去——闸门就是靠这个响的。
# 注意：vite / vue 家族这几条同时也是 src/test/toolchain_pin.test.ts 的断言对象，
# 两边必须一起动（那条守卫读的是 vitest 的 peer 区间，不写死版本号）。
[miniapp.overrides]
postcss = 8.5.28
source-map-js = 1.2.2
vite = 6.4.5
ws = 8.21.0
postcss-selector-parser = 7.1.6
follow-redirects = 1.16.2
adm-zip = 0.6.1
@intlify/core-base = 11.4.16
@intlify/message-compiler = 11.4.16
@intlify/message-resolver = 9.1.11
@intlify/shared = 11.4.16
minimatch = 11.0.1
glob = 14.0.2
@babel/core = 7.29.6
body-parser = 1.20.9
cookie = 0.7.0
send = 0.19.0
qs = 6.16.1
path-to-regexp = 0.1.13
jpeg-js = 0.4.4
phin = 3.7.1
@tootallnate/once = 2.0.1
esbuild = 0.25.12
vue = 3.4.21
@vue/compiler-core = 3.4.21
@vue/compiler-dom = 3.4.21
@vue/compiler-sfc = 3.4.21
@vue/compiler-ssr = 3.4.21
@vue/reactivity = 3.4.21
@vue/runtime-core = 3.4.21
@vue/runtime-dom = 3.4.21
@vue/server-renderer = 3.5.42
@vue/shared = 3.4.21
