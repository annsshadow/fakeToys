# 依赖漏洞基线（2026-10-27 第四轮实测）
#
# 用途：CI 的 dependency-audit job 拿它当**回归闸门**——任一严重度计数
# 超过下面这个数就红；低于它就提示回来更新本文件（否则这次修复没留下守卫）。
#
# 演变（每一轮都留读数，别美化）：
#   2026-10-15  39 条（3/13/16/7）——立基线，全部挂在 @dcloudio 构建链/测试链。
#   2026-10-22 上午  47 条（3/16/20/8）——漏洞库新发布一批 advisory，CI 变红，
#               两个 dependabot PR（#100 vite / #101 follow-redirects）一起被挡住。
#   2026-10-22 下午  3 条（0/1/2/0）——按「能真修就真修」逐条处置：
#               overrides 顶掉 44 条（详见 miniapp/pnpm-workspace.yaml 的分组注释），
#               其中 vite 5.4.21→6.4.4、vitest 2.1.9→4.1.12 是两次跨大版本，
#               依据是 oa4rust/mobile 的同一套 dcloudio 工具链已在 vite 6 上长期全绿。
#   2026-10-27  0 条（0/0/0/0）——第四轮，Dependabot 24 条 open 告警的收尾：
#               - phin 2.9.3 → override 3.7.1（GHSA-x565，见 miniapp yaml 注释）。
#                 上一轮把这条记成「phin 3.7.1 无修复版本」是读错了：公告的
#                 受影响区间是 <3.7.1，真正命中的是树里那份 2.9.3。
#               - body-parser 1.20.6 → 1.20.9（GHSA-27r3）。
#               - vite 声明值 5.2.8 → 6.4.4，与 override 对齐。此前声明 5.2.8 /
#                 实装 6.4.4，dependabot 按声明值一次报了 20 条早已修掉的漏洞。
#               上一轮记的 braces / sprintf-js 两条已不再命中（依赖树变动）。
#
# 改这个文件前先确认两件事：
#   1. 新增的确实是构建期/测试期依赖，没有一个进 mp-weixin 或 h5 产物
#      （在 dist/build/{mp-weixin,h5} 里搜该包的特征串，命中即不可放宽）
#   2. 有 @dcloudio 上游发版或别的办法能真正修掉它 —— 有就修，别抬基线
#
# 修好一条就从这里减一条，并把 pnpm-workspace.yaml 的 overrides 记上。
# 现在是 0：任何一条新漏洞都会直接让闸门变红，这是刻意的。
[miniapp]
critical = 0
high = 0
moderate = 0
low = 0
total = 0

[admin]
critical = 0
high = 0
moderate = 0
low = 0
total = 0

# 下面这些是 miniapp/pnpm-workspace.yaml 里 overrides 钉住的版本。
# 少任何一条，计数会立刻涨回去——闸门就是靠这个响的。
# 注意：vite / vue 家族这几条同时也是 src/test/toolchain_pin.test.ts 的断言对象，
# 两边必须一起动（那条守卫读的是 vitest 的 peer 区间，不写死版本号）。
[miniapp.overrides]
postcss = 8.5.28
source-map-js = 1.2.2
vite = 6.4.4
ws = 8.21.0
postcss-selector-parser = 7.1.6
follow-redirects = 1.16.1
adm-zip = 0.6.1
@intlify/core-base = 9.14.5
@intlify/message-compiler = 9.14.5
@intlify/message-resolver = 9.1.11
@babel/core = 7.29.6
body-parser = 1.20.9
cookie = 0.7.0
send = 0.19.0
qs = 6.16.0
path-to-regexp = 0.1.13
jpeg-js = 0.4.4
phin = 3.7.1
@tootallnate/once = 2.0.1
esbuild = 0.25.12
vue = 3.5.42
@vue/compiler-core = 3.5.42
@vue/compiler-dom = 3.5.42
@vue/compiler-sfc = 3.5.42
@vue/compiler-ssr = 3.5.42
@vue/reactivity = 3.5.42
@vue/runtime-core = 3.5.42
@vue/runtime-dom = 3.5.42
@vue/server-renderer = 3.5.42
@vue/shared = 3.5.42
