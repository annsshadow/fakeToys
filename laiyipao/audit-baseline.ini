# 依赖漏洞基线（2026-10-15 审计实测）
#
# 用途：CI 的 dependency-audit job 拿它当**回归闸门**——任一严重度计数
# 超过下面这个数就红。不是「必须为 0」：剩下的 39 条全部挂在 @dcloudio
# 构建链/测试链上（见 docs/laiyipao/audits/security-2026-10-13.md），
# 强推版本会把 @dcloudio 的精确 pin 打破，构建假红。实测产物里一个都没有。
#
# 改这个文件前先确认两件事：
#   1. 新增的确实是构建期/测试期依赖，没有一个进 mp-weixin 或 h5 产物
#      （在 dist/build/{mp-weixin,h5} 里搜该包的特征串，命中即不可放宽）
#   2. 有 @dcloudio 上游发版或别的办法能真正修掉它
#
# 修好一条就从这里减一条，并把 pnpm-workspace.yaml 的 overrides 记上。
[miniapp]
critical = 3
high = 13
moderate = 16
low = 7
total = 39

[admin]
critical = 0
high = 0
moderate = 0
low = 0
total = 0

# 下面这些是 pnpm-workspace.yaml 里 overrides 钉住的版本。
# 少任何一条，miniapp 的 high/moderate 计数会立刻涨回去——闸门就是靠这个响的。
[miniapp.overrides]
postcss = 8.5.28
source-map-js = 1.2.2
vite = 5.4.21
ws = 8.21.0
