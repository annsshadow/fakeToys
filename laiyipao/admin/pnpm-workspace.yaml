# pnpm 11 起 onlyBuiltDependencies 从 package.json 的 pnpm 字段迁移到本文件。
# pnpm 11.25 以 allowBuilds（每包布尔审批）决定 native/build 脚本是否执行；
# onlyBuiltDependencies 列表不再足以放行，否则 esbuild postinstall 被忽略
# （ERR_PNPM_IGNORED_BUILDS）致 CI pnpm install 退出码 1。
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild
# 依赖漏洞 override（2026-10-31）：minimatch <11.0.1 的 globparts 放大 DoS
# （GHSA-g3hv-75wg-m249）与 glob 9.0.0~14.0.1 的 AbortSignal 取消绕过
# （GHSA-3g3m-2fjr-6pw4），经 @vue/test-utils → js-beautify 和 vue-tsc →
# @vue/language-core 进入 dev 链，不进构建产物。补丁线 11.0.1 / 14.0.2。
overrides:
  minimatch: 11.0.1
  glob: 14.0.2
