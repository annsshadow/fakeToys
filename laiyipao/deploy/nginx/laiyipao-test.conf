# 来一炮 · 测试环境 nginx location 片段
# 部署位置：/etc/nginx/conf.d/laiyipao/*.conf（不挂进 ccy.conf，避免 HTTPS 白名单校验阻断 API 请求）
# 目标 VHost：home.conf（listen 80 + 443 ssl default_server，<YOUR_TEST_DOMAIN> 会解析到这里）
# 安装方式：mkdir -p /etc/nginx/conf.d/laiyipao && cp 本文件 /etc/nginx/conf.d/laiyipao/10-test.conf
#           在 home.conf 的 server 块内（location 区）加一行：
#             include /etc/nginx/conf.d/laiyipao/*.conf;
# 与 ccy.conf 里挂 bmp-platform 的 include 模式完全相同，不影响 ccy.conf 本身。

# API → lyp-server :9020（/usr/local/laiyipao）
location /laiyipao-api/ {
    proxy_pass http://127.0.0.1:9020/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 64m;
}

# 运营后台（/laiyipao-admin/，SPA）
location = /laiyipao-admin {
    return 301 /laiyipao-admin/;
}

location ^~ /laiyipao-admin/assets/ {
    alias /usr/local/laiyipao/admin/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location /laiyipao-admin/ {
    alias /usr/local/laiyipao/admin/;
    index index.html;
    try_files $uri $uri/ /laiyipao-admin/index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# 小程序 H5 版（/laiyipao-h5/，uni-app build:h5 产物）
location = /laiyipao-h5 {
    return 301 /laiyipao-h5/;
}

location ^~ /laiyipao-h5/assets/ {
    alias /usr/local/laiyipao/h5/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location ^~ /laiyipao-h5/static/ {
    alias /usr/local/laiyipao/h5/static/;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /laiyipao-h5/ {
    alias /usr/local/laiyipao/h5/;
    index index.html;
    try_files $uri $uri/ /laiyipao-h5/index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
