// Module
var code = "<div class=\"cc-mask cc-mask-show\" id=\"selectShift\"> <div class=\"sl-dialog\" id=\"selectShiftBox\"> <div class=\"sl-dialog-header\"> <span class=\"title\">{{$.title}}</span> <button class=\"close\" @click=\"closeSelectShift\"><i class=\"o2icon-icon_off\"></i></button> </div> <div class=\"sl-dialog-content\"> <div> <table width=\"100%\" border=\"0\" cellpadding=\"5\" cellspacing=\"0\" class=\"att_table\"> <thead> <th style=\"width:10%\">{{$.lp.choose}}</th> <th>{{$.lp.shiftName}}</th> <th>{{$.lp.checkInTime}}</th> </thead> <tbody class=\"selector\"> <tr oo-each=\"$.shiftList\" oo-item=\"shift\" @click=\"this.chooseShift(shift.value)\"> <td> <div class=\"icon\"><i class=\"{{ (shift.value.id && $.shiftSelected && $.shiftSelected.id && shift.value.id == $.shiftSelected.id) ? 'o2icon-radio-checked primary_color' : 'o2icon-radio-unchecked'}}\"></i></div></td> <td>{{shift.value.shiftName}}</td> <td>{{shift.value.properties.timeList[0].onDutyTime + ' - ' + shift.value.properties.timeList[shift.value.properties.timeList.length-1].offDutyTime}}</td> </tr> </tbody> </table> </div> <o-pager oo-prop=\"$.pagerData\" @refresh-data=\"loadData\"></o-pager> </div> <div class=\"sl-dialog-footer\"> <span> <button class=\"mainColor_bg\" @click=\"submit\">{{$.lp.positive}}</button> </span> </div> </div> </div>";
// Exports
export default code;
