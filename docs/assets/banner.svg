<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="fakeToys monorepo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.45" stop-color="#0d1430"/>
      <stop offset="1" stop-color="#080b1c"/>
    </linearGradient>

    <radialGradient id="a1">
      <stop offset="0" stop-color="#6d5efc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6d5efc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a2">
      <stop offset="0" stop-color="#00c2d1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00c2d1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a3">
      <stop offset="0" stop-color="#ff4d9d" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ff4d9d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee8fa"/>
      <stop offset="0.42" stop-color="#a78bfa"/>
      <stop offset="0.72" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#7ee8fa"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; -0.5 0; 0 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#8ea2ff" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>

    <mask id="titleMask">
      <text x="600" y="176" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"
            font-size="92" font-weight="800" letter-spacing="2" fill="#ffffff">fakeToys</text>
    </mask>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- 极光层 -->
  <ellipse cx="240" cy="70" rx="430" ry="250" fill="url(#a1)">
    <animate attributeName="cx" values="240;360;240" dur="17s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="11s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="960" cy="290" rx="420" ry="240" fill="url(#a2)">
    <animate attributeName="cx" values="960;840;960" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="13s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="640" cy="330" rx="360" ry="180" fill="url(#a3)">
    <animate attributeName="cy" values="330;250;330" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- 漂浮的「玩具积木」 -->
  <g opacity="0.9">
    <rect x="92" y="236" width="26" height="26" rx="7" fill="#6d5efc" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" values="0 105 249;360 105 249" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="y" values="236;222;236" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="137" y="262" width="18" height="18" rx="5" fill="#00c2d1" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0 146 271;360 146 271" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="y" values="262;274;262" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="1074" cy="112" r="13" fill="#f472b6" opacity="0.75">
      <animate attributeName="cy" values="112;96;112" dur="8s" repeatCount="indefinite"/>
    </circle>
    <rect x="1046" y="140" width="20" height="20" rx="6" fill="#fbbf24" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0 1056 150;360 1056 150" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 标题 -->
  <text x="600" y="176" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="92" font-weight="800" letter-spacing="2" fill="url(#titleGrad)">fakeToys</text>
  <g mask="url(#titleMask)">
    <rect x="-300" y="90" width="260" height="120" fill="url(#shine)">
      <animate attributeName="x" values="-300;1400" dur="4.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 副标题 -->
  <text x="600" y="222" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif"
        font-size="21" fill="#c7d2fe" opacity="0.92">一个装着若干「不那么玩具」的玩具箱 · multi-language monorepo</text>

  <g font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="14">
    <rect x="286" y="262" width="628" height="52" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="312" y="294" fill="#93c5fd">🦀 oa4rust</text>
    <text x="428" y="294" fill="#5eead4">💥 laiyipao</text>
    <text x="556" y="294" fill="#fcd34d">🧪 augmentor</text>
    <text x="676" y="294" fill="#f9a8d4">✅ auto-checkin</text>
    <text x="812" y="294" fill="#c4b5fd">🧠 llm-lab</text>
    <text x="906" y="294" fill="#fdba74">🔐 cool</text>
  </g>
</svg>
