packages:
  - 'packages/*'
  - 'apps/*'
  - '!**/test/**'
# 安全覆盖：把传递依赖中的已知漏洞版本抬到修复版本。
# 目标版本优先选择"依赖树中已存在的版本"，以降低兼容性风险。
# 对应告警见 GitHub Dependabot（apps/mobile 的 uni-app 工具链）。
overrides:
  '@babel/core@7.25.2': '7.29.6'
  '@intlify/core-base@9.1.9': '9.14.5'
  '@intlify/message-compiler@9.1.9': '9.14.5'
  '@intlify/message-resolver@9.1.9': '9.1.11'
  'adm-zip@0.5.16': '0.6.1'
  'body-parser@1.20.3': '1.20.6'
  'cookie@0.6.0': '0.7.0'
  'jpeg-js@0.3.7': '0.4.4'
  'path-to-regexp@0.1.10': '0.1.13'
  'postcss-selector-parser@6.1.2': '6.1.3'
  'postcss@8.5.6': '8.5.26'
  'send@0.18.0': '0.19.0'
  'ws@8.18.0': '8.21.0'
  # 以下三项用范围覆盖：同一漏洞在树中存在多份副本，
  # 按版本逐个覆盖会漏掉新解析出的版本。
  'esbuild@<=0.24.2': '0.25.12'
  'qs@<6.16.0': '6.16.0'
  'vite@<=6.4.2': '6.4.3'
allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@dcloudio/uni-app-plus@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-app-uts@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-app-vite@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-app-vue@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-app@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-cli-shared@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-cloud@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-components@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-console@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-h5-vite@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-h5-vue@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-h5@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-i18n@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-mp-compiler@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-mp-vite@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-mp-vue@3.0.0-alpha-5020620260914001'
  - '@dcloudio/uni-mp-weixin@3.0.0-alpha-5020620260914001'
