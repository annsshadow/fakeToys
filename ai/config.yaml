# AI 训练数据增强工具配置文件

# 模型配置
models:
  # 默认使用的模型
  default: ernie
  
  # 百度 ERNIE 配置
  ernie:
    type: baidu
    api_key: ${BAIDU_API_KEY}
    secret_key: ${BAIDU_SECRET_KEY}
    model: ernie-3.5-8k
    temperature: 0.99
    top_p: 0.95
    max_output_tokens: 2048
  
  # OpenAI 配置
  openai:
    type: openai
    api_key: ${OPENAI_API_KEY}
    model: gpt-3.5-turbo
    temperature: 0.99
    top_p: 0.95
    max_output_tokens: 2048
  
  # 本地模型配置 (Ollama)
  ollama:
    type: ollama
    base_url: http://localhost:11434
    model: qwen2:7b
    temperature: 0.99
    top_p: 0.95
    max_output_tokens: 2048

# 增强配置
augmentation:
  # 每条 seed 生成的变体数量
  variants_per_seed: 5
  
  # 并发线程数
  num_threads: 40
  
  # 自动保存间隔（每 N 条）
  auto_save_interval: 10
  
  # 重试次数
  max_retries: 3
  
  # 重试间隔（秒）
  retry_delay: 1

# 质量评分配置
quality:
  # 启用质量评分
  enabled: true
  
  # 质量阈值（低于此分数的样本被过滤）
  threshold: 0.6
  
  # 评分权重 [语义相似度, 回答相关性, 多样性]
  weights: [0.3, 0.4, 0.3]

# 去重配置
dedup:
  # 启用智能去重
  enabled: true
  
  # 相似度阈值（高于此值被视为重复）
  threshold: 0.9

# 导出配置
export:
  # 默认导出格式
  default_format: jsonl
  
  # 支持的导出格式
  formats:
    - jsonl
    - llama_factory
    - alpaca
    - sharegpt
    - chatml

# 对话上下文配置
context:
  # 启用对话上下文增强
  enabled: false
  
  # 对话轮数
  num_turns: 3

# 版本管理配置
versioning:
  # 启用版本管理
  enabled: true
  
  # 版本存储目录
  storage_dir: data/versions
  
  # 自动快照（增强完成后）
  auto_snapshot: true

# 主动学习配置
sampler:
  # 启用主动学习选样
  enabled: false
  
  # 分析维度
  dimensions:
    - topic
    - question_type
    - length
    - complexity

# 领域扩展配置
expander:
  # 启用自动领域扩展
  enabled: false
  
  # 扩展策略
  strategies:
    - similar
    - related
    - scenario

# 效果追踪配置
tracker:
  # 启用微调效果追踪
  enabled: false
  
  # 追踪指标
  metrics:
    - train_loss
    - eval_accuracy
    - perplexity

# 可视化配置
visualization:
  # 启用数据可视化
  enabled: true
  
  # 可视化类型
  types:
    - wordcloud
    - length_distribution
    - topic_cluster
    - timeline
    - quality_distribution

# Web UI 配置
web:
  # 服务端口
  port: 8000
  
  # 服务地址
  host: 0.0.0.0
  
  # 静态文件目录
  static_dir: web/dist

# 日志配置
logging:
  # 日志级别
  level: INFO
  
  # 日志文件
  file: app.log
  
  # 日志格式
  format: "%(asctime)s - %(levelname)s - %(message)s"
